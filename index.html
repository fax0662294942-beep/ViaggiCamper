function TagBadges({itemTags, visibleTags}){
  if(!itemTags||!itemTags.length) return null;
  const myVisible = (visibleTags||[]).filter(t=>itemTags.includes(t.id));
  if(!myVisible.length) return null;
  return(
    <div style={{display:'flex',gap:3,flexWrap:'wrap',marginTop:3}}>
      {myVisible.map(t=>(
        <span key={t.id} style={{fontSize:9,fontWeight:700,padding:'1px 6px',borderRadius:10,
          background:t.color+'22',color:t.color,border:'1px solid '+t.color+'55',letterSpacing:.2}}>
          {t.name}
        </span>
      ))}
    </div>
  );
}

function DispensaView({dispensa, dispensaId, updateDispensa, user, onBack}){
  useBack(onBack);
  const cats        = dispensa.categories     || DISP_CATS_DEFAULT;
  const prods       = dispensa.products       || [];
  const spesa       = dispensa.spesaManuale   || [];
  const persone     = dispensa.persone        || DISP_PERS_DEFAULT;
  const valigie     = dispensa.valigie        || [];
  const tags        = dispensa.tags           || [];
  const luoghi      = dispensa.luoghi         || [];
  const isAdmin     = dispensa.ownerId === user.uid;
  // Migrazione automatica: vecchio formato {valigiaId, status:string} → nuovo {valigie:[], status:{}, disabled:{}}
  const valProd = (dispensa.valigieProdotti||[]).map(i=> i.valigie ? i : {
    ...i,
    valigie:  i.valigiaId ? [{id:i.valigiaId, qty:i.qty||''}] : [],
    status:   typeof i.status   === 'string' ? {} : (i.status  ||{}),
    disabled: typeof i.disabled === 'boolean'? {} : (i.disabled||{}),
  });

  const [tab,setTab]           = React.useState('inventario');
  const [invVista,setInvVista] = React.useState('categorie');
  const [luogoOpenMap,setLuogoOpenMap] = React.useState({});
  const [selCat,setSelCat]     = React.useState('all');
  const [invFil,setInvFil]     = React.useState('all');
  const [portareOk,setPortareOk] = React.useState({});
  const [persId,setPersId]     = React.useState(null);
  const [expandV,setExpandV]   = React.useState(null);
  const [valigieTab,setValigieTab] = React.useState('list');
  const [selectedTag,setSelectedTag] = React.useState(null);
  const [manInp,setManInp]     = React.useState('');
  const [showShare,setShowShare]= React.useState(false);
  // modals: null | {type, data}
  const [modal,setModal]       = React.useState(null);

  const upd = ch => updateDispensa({...dispensa,...ch});
  const activePers = persId || persone.filter(p=>!p.disabled)[0]?.id;

  // ── CRUD helpers ──────────────────────────────────────────────────────
  const saveProd = p => { upd({products: p.id ? prods.map(x=>x.id===p.id?p:x) : [...prods,{...p,id:Date.now()}]}); setModal(null); };
  const delProd  = id => { upd({products:prods.filter(p=>p.id!==id), valigieProdotti:valProd.filter(vp=>vp.productId!==id)}); setModal(null); };
  const setStatus= (id,s) => upd({products:prods.map(p=>p.id===id?{...p,status:s}:p)});
  const toggleBuy= id => upd({products:prods.map(p=>p.id===id?{...p,toBuy:!p.toBuy}:p)});

  const saveCat = c => { upd({categories: c.id&&cats.find(x=>x.id===c.id) ? cats.map(x=>x.id===c.id?c:x) : [...cats,{...c,id:'cat_'+Date.now()}]}); setModal(null); };
  const delCat  = id => { if(prods.some(p=>p.cat===id)){alert('Sposta prima i prodotti da questa categoria.');return;} if(!confirm('Eliminare la categoria?'))return; upd({categories:cats.filter(c=>c.id!==id)}); setModal(null); };

  const saveValigia = v => { upd({valigie: v.id&&valigie.find(x=>x.id===v.id) ? valigie.map(x=>x.id===v.id?v:x) : [...valigie,{...v,id:'v_'+Date.now(),personaId:activePers,active:true}]}); setModal(null); };
  const delValigia  = id => {
    if(!confirm('Eliminare valigia?'))return;
    const newVP = valProd.map(vp=>{const nv=vp.valigie.filter(x=>x.id!==id); return nv.length?{...vp,valigie:nv}:null;}).filter(Boolean);
    upd({valigie:valigie.filter(v=>v.id!==id), valigieProdotti:newVP}); setModal(null);
  };
  const toggleVActive = id => upd({valigie: valigie.map(v=>v.id===id?{...v,active:v.active===false?true:false}:v)});

  const saveVP = vp => { upd({valigieProdotti: vp.id&&valProd.find(x=>x.id===vp.id) ? valProd.map(x=>x.id===vp.id?vp:x) : [...valProd,{...vp,id:'vp_'+Date.now()}]}); setModal(null); };
  const delVP  = id => { upd({valigieProdotti:valProd.filter(i=>i.id!==id)}); setModal(null); };
  const toggleVPStatusPers = (id,pid) => {
    const cycle={ok:'low',low:'out',out:'ok'};
    upd({valigieProdotti:valProd.map(i=>i.id===id?{...i,status:{...(i.status||{}),[pid]:cycle[((i.status||{})[pid])||'ok']}}:i)});
  };

  const savePersona = p => { upd({persone: p.id&&persone.find(x=>x.id===p.id) ? persone.map(x=>x.id===p.id?p:x) : [...persone,{...p,id:'p_'+Date.now()}]}); setModal(null); };
  const delPersona  = id => {
    if(!confirm('Eliminare persona?'))return;
    const vids=valigie.filter(v=>v.personaId===id).map(v=>v.id);
    const newVP=valProd.map(vp=>{const nv=vp.valigie.filter(x=>!vids.includes(x.id));return nv.length?{...vp,valigie:nv}:null;}).filter(Boolean);
    upd({persone:persone.filter(p=>p.id!==id),valigie:valigie.filter(v=>v.personaId!==id),valigieProdotti:newVP}); setModal(null);
  };

  const addManual   = () => { if(!manInp.trim())return; upd({spesaManuale:[...spesa,{id:Date.now(),name:manInp.trim(),done:false}]}); setManInp(''); };
  const toggleManual= id => upd({spesaManuale:spesa.map(s=>s.id===id?{...s,done:!s.done}:s)});
  const removeManual= id => upd({spesaManuale:spesa.filter(s=>s.id!==id)});

  // Tags CRUD
  const visibleTags = tags.filter(t => t.type==='global' || t.createdBy===user.uid);
  const saveTag = t => {
    const updated = t.id && tags.find(x=>x.id===t.id)
      ? tags.map(x=>x.id===t.id?t:x)
      : [...tags,{...t,id:'tag_'+Date.now(),createdBy:user.uid}];
    upd({tags:updated}); setModal(null);
  };
  const delTag = id => {
    upd({
      tags: tags.filter(t=>t.id!==id),
      products: prods.map(p=>({...p,tags:(p.tags||[]).filter(tid=>tid!==id)})),
      valigieProdotti: valProd.map(vp=>({...vp,tags:(vp.tags||[]).filter(tid=>tid!==id)})),
    });
    if(selectedTag===id) setSelectedTag(null);
    setModal(null);
  };
  const toggleTagOnItem = (itemArr, setKey, itemId, tagId) => {
    const newArr = itemArr.map(x=>x.id===itemId
      ? {...x, tags: (x.tags||[]).includes(tagId) ? (x.tags||[]).filter(t=>t!==tagId) : [...(x.tags||[]),tagId]}
      : x
    );
    upd({[setKey]:newArr});
  };

  // Luoghi CRUD
  const saveLuogo = l => {
    const updated = l.id && luoghi.find(x=>x.id===l.id)
      ? luoghi.map(x=>x.id===l.id?l:x)
      : [...luoghi,{...l,id:'loc_'+Date.now()}];
    upd({luoghi:updated}); setModal(null);
  };
  const deleteLuogo = id => {
    upd({luoghi:luoghi.filter(l=>l.id!==id), products:prods.map(p=>p.luogoId===id?{...p,luogoId:null}:p)});
    setModal(null);
  };

  // Calcolo diretto senza useMemo per evitare problemi di dipendenze
  const activeProds = prods.filter(p=>!p.disabled);
  // Prodotti da mostrare: attivi filtrati + disattivati in fondo (sempre visibili ma oscurati)
  let filteredProds = selCat==='all' ? prods : prods.filter(p=>p.cat===selCat);
  if(invFil==='low')       filteredProds = filteredProds.filter(p=>p.status==='low'&&!p.disabled);
  else if(invFil==='out')  filteredProds = filteredProds.filter(p=>p.status==='out'&&!p.disabled);
  else if(invFil==='buy')  filteredProds = filteredProds.filter(p=>p.toBuy&&!p.disabled);
  // Ordina: attivi prima, disattivati in fondo
  filteredProds = [...filteredProds].sort((a,b)=>{
    if(a.disabled !== b.disabled) return a.disabled ? 1 : -1;
    return a.name.localeCompare(b.name,'it');
  });
  const statsOk  = activeProds.filter(p=>p.status==='ok').length;
  const statsLow = activeProds.filter(p=>p.status==='low').length;
  const statsOut = activeProds.filter(p=>p.status==='out').length;
  const statsBuy = activeProds.filter(p=>p.toBuy).length;


  // ── TAB: INVENTARIO ───────────────────────────────────────────────────
  // Mini badge tag per le righe prodotto

  const TabInventario = () => {
    const renderVistaLuoghi = () => {
      const prodsAttivi = prods.filter(p=>!p.disabled);
      const slots = [
        ...luoghi.map(l=>({id:l.id,nome:l.nome,icona:l.icona||'📍',items:prodsAttivi.filter(p=>p.luogoId===l.id)})),
        {id:null,nome:'Senza luogo',icona:'❓',items:prodsAttivi.filter(p=>!p.luogoId)},

          {slots.map(slot=>{
            const isOpen=luogoOpenMap[slot.id||'null']!==false;

                <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',
                  borderBottom:isOpen&&slot.items.length?'1px solid var(--border)':'none',cursor:'pointer'}}
                  onClick={()=>setLuogoOpenMap(m=>({...m,[slot.id||'null']:!isOpen}))}>
                  <span style={{fontSize:20}}>{slot.icona}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600}}>{slot.nome}</div>
                    <div style={{fontSize:11,color:bad>0?'var(--red)':'var(--text3)'}}>{slot.items.length} prodotti{bad>0?` · ${bad} da controllare`:''}</div>
                  </div>
                  {slot.id&&<button className="btn-icon btn-sm" style={{color:'var(--text3)'}}
                    onClick={e=>{e.stopPropagation();setModal({type:'luogo',data:{...luoghi.find(l=>l.id===slot.id)}});}}>✏️</button>}
                  <span style={{color:'var(--text3)',fontSize:12}}>{isOpen?'▲':'▼'}</span>
                </div>
                {isOpen&&(
                  <div style={{padding:'0 12px 8px'}}>
                    {slot.items.length===0
                      ? <p style={{fontSize:12,color:'var(--text3)',padding:'8px 0'}}>Nessun prodotto in questo luogo</p>
                      : slot.items.map(p=>{
                          const cat=cats.find(c=>c.id===p.cat);
                          return(
                            <div key={p.id} className="ds-row">
                              <span style={{fontSize:15,flexShrink:0}}>{cat?.icon||'📦'}</span>
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{fontSize:13,fontWeight:500}}>{p.name}</div>
                                {(p.qty||p.note)&&<div style={{fontSize:10,color:'var(--text3)'}}>{p.qty?'Qtà: '+p.qty:''}{p.qty&&p.note?' · ':''}{p.note}</div>}
                                <TagBadges itemTags={p.tags} visibleTags={visibleTags}/>
                              </div>
                              <button className={`ds-status ${dsStatusClass(p.status||'ok')}`}
                                style={{fontSize:10,padding:'2px 7px'}} onClick={()=>setStatus(p.id,dsCycleStatus(p.status))}>
                                {dsStatusLabel(p.status||'ok')}
                              </button>
                              <button className="btn-icon btn-sm" onClick={()=>setModal({type:'prod',data:{...p}})}>✏️</button>
                            </div>
                          );
                        })
                    }
                  </div>
                )}
              </div>
            );
          })}
          <button className="ds-fab" onClick={()=>setModal({type:'prod',data:{id:null,name:'',cat:cats[0]?.id||'varie',qty:'',note:'',status:'ok',toBuy:false,disabled:false,luogoId:null}})}>+</button>
        </div>
      );
    };

    return (
      <div>
        {/* Statistiche rapide */}
        <div className="card-sm" style={{display:'flex',justifyContent:'space-around',padding:'16px 8px',marginBottom:14,gap:4}}>
          {[[activeProds.length,'var(--text)','TOTALE','all','all'],[statsLow,'var(--accent)','⚠️ SCARSO','all','low'],[statsOut,'var(--red)','❌ MANCANTE','all','out'],[statsBuy,'var(--primary)','🛒 DA COMP.','all','buy']].map(([num,col,lbl,cat,fil])=>(
            <div key={lbl} onClick={()=>{setSelCat(cat);setInvFil(fil);setInvVista('categorie');}}
              style={{textAlign:'center',cursor:'pointer',flex:1,padding:'8px 4px',borderRadius:10,
                background:(invVista==='categorie'&&selCat===cat&&invFil===fil)?`rgba(${hexRgb(col==='var(--text)'?'#d8eee4':col.replace('var(--accent)','#f0a045').replace('var(--red)','#f06060').replace('var(--primary)','#4fd8b4'))},.1)`:'transparent'}}>
              <div style={{fontSize:26,fontWeight:800,fontFamily:"'Syne',sans-serif",color:col,lineHeight:1}}>{num}</div>
              <div style={{fontSize:10,color:'var(--text3)',fontWeight:600,marginTop:4}}>{lbl}</div>
            </div>
          ))}
        </div>

        {/* Pill vista */}
        <div style={{display:'flex',gap:0,borderRadius:10,overflow:'hidden',border:'1px solid var(--border)',marginBottom:14}}>
          {[['categorie','📦 Categorie'],['luoghi','📍 Luoghi']].map(([k,lbl])=>(
            <button key={k} onClick={()=>setInvVista(k)}
              style={{flex:1,padding:'8px 4px',fontSize:12,fontWeight:600,border:'none',cursor:'pointer',
                background:invVista===k?'var(--primary)':'var(--card)',
                color:invVista===k?'var(--bg)':'var(--text2)',transition:'background .15s'}}>
              {lbl}
            </button>
          ))}
        </div>

        {invVista==='luoghi' && renderVistaLuoghi()}

        {invVista==='categorie' && (<>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginBottom:12}}>
            {[{id:'all',name:'Tutti',icon:'📋',color:'#4fd8b4'},...cats].map(c=>{
              const tot=c.id==='all'?prods.filter(p=>!p.disabled).length:prods.filter(p=>p.cat===c.id&&!p.disabled).length;
              const bad=c.id==='all'?0:prods.filter(p=>p.cat===c.id&&!p.disabled&&(p.status==='low'||p.status==='out')).length;
              const isSel=selCat===c.id;
              return(
                <div key={c.id} onClick={()=>{setSelCat(c.id);setInvFil('all');}}
                  style={{background:isSel?`rgba(${hexRgb(c.color)},.18)`:'var(--card)',border:'1.5px solid '+(isSel?c.color:'var(--border)'),borderRadius:12,padding:'10px 4px',textAlign:'center',cursor:'pointer',position:'relative',transition:'all .15s'}}>
                  <div style={{fontSize:18,marginBottom:3}}>{c.icon}</div>
                  <div style={{fontSize:9,color:'var(--text2)',fontWeight:600,lineHeight:1.2}}>{c.name}</div>
                  <div style={{fontSize:11,fontWeight:700,color:bad>0?'var(--red)':'var(--text2)'}}>{tot}</div>
                  {bad>0&&<div style={{position:'absolute',top:3,right:3,background:'var(--red)',color:'#fff',fontSize:9,fontWeight:800,minWidth:15,height:15,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center'}}>{bad}</div>}
                </div>
              );
            })}
          </div>
          {selCat!=='all'&&(
            <div style={{display:'flex',gap:5,marginBottom:10,overflowX:'auto'}}>
              {[['all','Tutti'],['low','⚠️ Scarso'],['out','❌ Mancante'],['buy','🛒 Da comprare']].map(([f,l])=>(
                <button key={f} className={`btn-tab${invFil===f?' active':''}`} onClick={()=>setInvFil(f)} style={{flexShrink:0,padding:'4px 9px',fontSize:11}}>{l}</button>
              ))}
            </div>
          )}
          <div style={{display:'flex',justifyContent:'flex-end',marginBottom:8}}>
            <button className="btn" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>setModal({type:'catManage'})}>⚙️ Categorie</button>
          </div>
          {filteredProds.length===0
            ?<div className="empty"><div className="empty-icon">📦</div><p>Nessun prodotto trovato</p></div>
            :<div className="card-sm" style={{padding:'0 12px'}}>
              {filteredProds.map(p=>{
                const cat=cats.find(c=>c.id===p.cat);
                return(
                  <div key={p.id} className="ds-row" style={{opacity:p.disabled?0.4:1}}>
                    <span style={{fontSize:16,flexShrink:0}}>{cat?.icon||'📦'}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:500,textDecoration:p.disabled?'line-through':'none'}}>{p.name}</div>
                      {(p.qty||p.note)&&!p.disabled&&<div style={{fontSize:10,color:'var(--text3)'}}>{p.qty?'Qtà: '+p.qty:''}{p.qty&&p.note?' · ':''}{p.note}</div>}
                      {p.disabled&&<div style={{fontSize:10,color:'var(--text3)'}}>disattivato</div>}
                      <TagBadges itemTags={p.tags} visibleTags={visibleTags}/>
                    </div>
                    {!p.disabled&&<>
                      <button className={`ds-status ${dsStatusClass(p.status||'ok')}`} onClick={()=>setStatus(p.id,dsCycleStatus(p.status))}>
                        {dsStatusLabel(p.status||'ok')}
                      </button>
                      <button onClick={()=>toggleBuy(p.id)}
                        style={{fontSize:11,fontWeight:700,padding:'3px 8px',borderRadius:12,border:'1.5px solid',cursor:'pointer',whiteSpace:'nowrap',
                          background:p.toBuy?'rgba(79,216,180,.15)':'transparent',
                          color:p.toBuy?'var(--primary)':'var(--text3)',
                          borderColor:p.toBuy?'var(--primary)':'transparent'}}>
                        🛒{p.toBuy?' Spesa':''}
                      </button>
                    </>}
                    {p.disabled&&<button className="btn btn-sm" style={{fontSize:10,padding:'3px 8px',color:'var(--primary)'}}
                      onClick={()=>setModal({type:'prod',data:{...p}})}>riattiva</button>}
                    <button className="btn-icon btn-sm" onClick={()=>setModal({type:'prod',data:{...p}})}>✏️</button>
                  </div>
                );
              })}
            </div>
          }
          <button className="ds-fab" onClick={()=>setModal({type:'prod',data:{id:null,name:'',cat:cats[0]?.id||'varie',qty:'',note:'',status:'ok',toBuy:false,disabled:false,luogoId:null}})}>+</button>
        </>)}
      </div>
    );
  };

  // ── TAB: SPESA ────────────────────────────────────────────────────────
  const TabSpesa = () => {
    const autoBuy=prods.filter(p=>p.toBuy&&!p.disabled);
    return (
      <div>
        <div className="card-sm" style={{textAlign:'center',padding:'14px',marginBottom:12}}>
          <div style={{fontSize:28,fontWeight:800,fontFamily:"'Syne',sans-serif",color:'var(--primary)'}}>{autoBuy.length+spesa.filter(s=>!s.done).length}</div>
          <div style={{fontSize:12,color:'var(--text2)'}}>articoli da acquistare</div>
        </div>
        {autoBuy.length>0&&(
          <div style={{marginBottom:14}}>
            <div className="section-title" style={{marginBottom:8}}>📦 Da inventario</div>
            <div className="card-sm" style={{padding:'0 12px'}}>
              {autoBuy.map(p=>{const cat=cats.find(c=>c.id===p.cat);return(
                <div key={p.id} className="ds-row">
                  <span style={{fontSize:15}}>{cat?.icon||'📦'}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:500}}>{p.name}</div>
                    <div style={{fontSize:10,color:'var(--text3)'}}>{cat?.name}</div>
                    <TagBadges itemTags={p.tags} visibleTags={visibleTags}/>
                  </div>
                  <span className={`ds-status ${dsStatusClass(p.status||'ok')}`}>{dsStatusLabel(p.status||'ok')}</span>
                  <button className="btn-icon btn-sm" style={{color:'var(--red)'}} title="Togli dalla lista" onClick={()=>toggleBuy(p.id)}>✕</button>
                </div>
              );})}
            </div>
          </div>
        )}
        <div className="section-title" style={{marginBottom:8}}>✍️ Lista manuale</div>
        <div style={{display:'flex',gap:8,marginBottom:10}}>
          <input className="field-input" style={{flex:1}} value={manInp} onChange={e=>setManInp(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&addManual()} placeholder="Aggiungi articolo..."/>
          <button className="btn-primary" onClick={addManual}>+</button>
        </div>
        {spesa.length>0&&(
          <div className="card-sm" style={{padding:'0 12px'}}>
            {spesa.map(s=>(
              <div key={s.id} className="ds-row">
                <button className="btn-icon btn-sm" style={{color:s.done?'var(--green)':'var(--text3)',fontSize:18,width:24,flexShrink:0}} onClick={()=>toggleManual(s.id)}>{s.done?'✓':'○'}</button>
                <span style={{flex:1,fontSize:13,textDecoration:s.done?'line-through':'none',color:s.done?'var(--text3)':'var(--text)'}}>{s.name}</span>
                <button className="btn-icon btn-sm" style={{color:'var(--red)'}} onClick={()=>removeManual(s.id)}>✕</button>
              </div>
            ))}
          </div>
        )}
        {autoBuy.length===0&&spesa.length===0&&<div className="empty"><div className="empty-icon">🛒</div><p>Lista spesa vuota!</p></div>}
      </div>
    );
  };

  // ── TAB: DA PORTARE ───────────────────────────────────────────────────
  const TabPortare = () => {
    const items=prods.filter(p=>(p.status==='out'||p.status==='low')&&!p.toBuy&&!p.disabled);
    if(!items.length) return(
      <div className="empty" style={{paddingTop:60}}>
        <div className="empty-icon">🏠</div>
        <p>Nessun articolo da portare!</p>
        <p style={{fontSize:12,color:'var(--text3)',marginTop:8}}>Appaiono qui i prodotti Scarso/Mancante che non sono nella lista spesa.</p>
      </div>
    );
    const rimasti=items.filter(p=>!portareOk[p.id]).length;
    return(
      <div>
        <div className="card-sm" style={{textAlign:'center',padding:'12px',marginBottom:12}}>
          <div style={{fontSize:26,fontWeight:800,fontFamily:"'Syne',sans-serif",color:'var(--accent)'}}>{rimasti}</div>
          <div style={{fontSize:12,color:'var(--text2)'}}>da portare da casa</div>
        </div>
        <div className="card-sm" style={{padding:'0 12px'}}>
          {items.map(p=>{
            const checked=!!portareOk[p.id], cat=cats.find(c=>c.id===p.cat);
            return(
              <div key={p.id} className="ds-row" style={{opacity:checked?0.45:1}}>
                <button className="btn-icon btn-sm" style={{color:checked?'var(--green)':'var(--text3)',fontSize:18,width:24,flexShrink:0}}
                  onClick={()=>setPortareOk(prev=>({...prev,[p.id]:!prev[p.id]}))}>
                  {checked?'✓':'○'}
                </button>
                <span style={{fontSize:15}}>{cat?.icon||'📦'}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:500,textDecoration:checked?'line-through':'none'}}>{p.name}</div>
                  {p.note&&<div style={{fontSize:10,color:'var(--text3)'}}>{p.note}</div>}
                </div>
                <span className={`ds-status ${dsStatusClass(p.status)}`}>{dsStatusLabel(p.status)}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // ── TAB: VALIGIE ──────────────────────────────────────────────────────
  const TabValigie = () => {
    const activePersList = persone.filter(p=>!p.disabled);
    const currP = persone.find(p=>p.id===activePers);
    const myV   = valigie.filter(v=>v.personaId===activePers);
    const myActiveVIds = myV.filter(v=>v.active!==false).map(v=>v.id);

    // Prodotti da preparare: in valigie attive, non-ok per activePers, non disabilitati per activePers
    const daPreparare = valProd.filter(item=>
      myActiveVIds.length>0 &&
      item.valigie.some(v=>myActiveVIds.includes(v.id)) &&
      !((item.disabled||{})[activePers]) &&
      ((item.status||{})[activePers]||'ok') !== 'ok'
    );

    const statusIcon = s => s==='ok'?'✅':s==='low'?'⚠️':'❌';
    const statusLabel= s => s==='ok'?'OK':s==='low'?'Scarso':'Mancante';
    const statusClass= s => s==='ok'?'ds-ok':s==='low'?'ds-low':'ds-out';

    return(
      <div>
        {/* Selettore persona */}
        {activePersList.length>1&&(
          <div style={{display:'flex',gap:8,overflowX:'auto',marginBottom:12,paddingBottom:2}}>
            {activePersList.map(p=>(
              <button key={p.id} onClick={()=>setPersId(p.id)}
                style={{padding:'6px 14px',borderRadius:20,fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',flexShrink:0,
                  background:p.id===activePers?p.colore:'var(--card)',color:p.id===activePers?'var(--bg)':'var(--text2)',
                  border:'1.5px solid '+(p.id===activePers?p.colore:'var(--border2)')}}>
                {p.nome}
              </button>
            ))}
          </div>
        )}

        {/* Sub-tabs */}
        <div style={{display:'flex',gap:0,borderRadius:10,overflow:'hidden',border:'1px solid var(--border)',marginBottom:14}}>
          {[['list','🧳 Valigie'],['prepare','📋 Da preparare']].map(([k,lbl])=>(
            <button key={k} onClick={()=>setValigieTab(k)}
              style={{flex:1,padding:'8px 4px',fontSize:12,fontWeight:600,border:'none',cursor:'pointer',
                background:valigieTab===k?'var(--primary)':'var(--card)',
                color:valigieTab===k?'var(--bg)':'var(--text2)',transition:'background .15s'}}>
              {lbl}{k==='prepare'&&daPreparare.length>0?` (${daPreparare.length})`:''}
            </button>
          ))}
        </div>

        {/* ── LISTA VALIGIE ── */}
        {valigieTab==='list'&&(
          <div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <div style={{fontSize:12,color:'var(--text2)'}}>{currP?.nome||'—'} · {myV.length} {myV.length===1?'valigia':'valigie'}</div>
              <button className="btn-primary" style={{padding:'6px 12px',fontSize:12}}
                onClick={()=>setModal({type:'valigia',data:{id:null,nome:'',icon:'🧳',personaId:activePers,active:true}})}>
                + Valigia
              </button>
            </div>
            {myV.length===0
              ? <div className="empty"><div className="empty-icon">🧳</div><p>Nessuna valigia per {currP?.nome||'questa persona'}</p></div>
              : myV.map(v=>{
                  const isActive = v.active!==false;
                  const items = valProd.filter(item=>item.valigie.some(x=>x.id===v.id));
                  const activePersStatus = s => (s||{})[activePers]||'ok';
                  const okC  = items.filter(i=>!((i.disabled||{})[activePers])&&activePersStatus(i.status)==='ok').length;
                  const visC = items.filter(i=>!((i.disabled||{})[activePers])).length;
                  const isExp= expandV===v.id;
                  return(
                    <div key={v.id} className="card-sm" style={{marginBottom:10,padding:0,overflow:'hidden',opacity:isActive?1:0.55}}>
                      <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',
                        borderBottom:isExp?'1px solid var(--border)':'none',cursor:'pointer'}}
                        onClick={()=>setExpandV(isExp?null:v.id)}>
                        <span style={{fontSize:20}}>{v.icon||'🧳'}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:600}}>{v.nome}</div>
                          <div style={{fontSize:11,color:visC>0&&okC===visC?'var(--green)':'var(--text2)'}}>
                            {visC===0?'vuota':`${okC}/${visC} OK`}
                            {!isActive&&<span style={{color:'var(--text3)',marginLeft:6}}>· disattivata</span>}
                          </div>
                        </div>
                        {/* Toggle attiva */}
                        <button title={isActive?'Disattiva':'Attiva'}
                          onClick={e=>{e.stopPropagation();toggleVActive(v.id);}}
                          style={{fontSize:14,padding:'4px 6px',borderRadius:6,border:'1px solid var(--border)',
                            background:isActive?'var(--primary-faint)':'var(--card)',
                            color:isActive?'var(--primary)':'var(--text3)',cursor:'pointer'}}>
                          {isActive?'⚡':'○'}
                        </button>
                        <button className="btn-icon btn-sm" style={{color:'var(--primary)'}}
                          onClick={e=>{e.stopPropagation();setModal({type:'valigia',data:{...v}});}}>✏️</button>
                        <span style={{color:'var(--text3)',fontSize:12}}>{isExp?'▲':'▼'}</span>
                      </div>
                      {isExp&&(
                        <div style={{padding:'6px 14px 12px'}}>
                          {items.length===0&&<p style={{fontSize:12,color:'var(--text3)',padding:'8px 0'}}>Valigia vuota — aggiungi articoli</p>}
                          {items.map(item=>{
                            const pid=activePers;
                            const st=(item.status||{})[pid]||'ok';
                            const dis=(item.disabled||{})[pid]||false;
                            const qtyObj=item.valigie.find(x=>x.id===v.id);
                            return(
                              <div key={item.id} className="ds-row" style={{opacity:dis?0.4:1}}>
                                <button className={`ds-status ${statusClass(st)}`}
                                  style={{fontSize:10,padding:'2px 7px',minWidth:32}}
                                  onClick={()=>toggleVPStatusPers(item.id,pid)}>
                                  {statusIcon(st)}
                                </button>
                                <div style={{flex:1,minWidth:0}}>
                                  <div style={{fontSize:12,fontWeight:500}}>{item.name}</div>
                                  {item.note&&<div style={{fontSize:10,color:'var(--text3)'}}>{item.note}</div>}
                                  {qtyObj?.qty&&<div style={{fontSize:10,color:'var(--text2)'}}>Qtà: {qtyObj.qty}</div>}
                                  <TagBadges itemTags={item.tags} visibleTags={visibleTags}/>
                                </div>
                                <button className="btn-icon btn-sm"
                                  onClick={()=>setModal({type:'vpItem',data:{...item},valigiaCtx:v.id})}>✏️</button>
                              </div>
                            );
                          })}
                          <button className="btn" style={{width:'100%',marginTop:8,fontSize:12,padding:'7px'}}
                            onClick={()=>setModal({type:'vpItem',data:{id:null,name:'',note:'',valigie:[{id:v.id,qty:''}],status:{},disabled:{}},valigiaCtx:v.id})}>
                            + Aggiungi articolo
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })
            }
          </div>
        )}

        {/* ── DA PREPARARE ── */}
        {valigieTab==='prepare'&&(
          <div>
            <div style={{fontSize:12,color:'var(--text2)',marginBottom:10}}>
              Articoli mancanti o scarsi nelle valigie attive di {currP?.nome||'—'}
            </div>
            {daPreparare.length===0
              ? <div className="empty"><div className="empty-icon">✅</div><p>Tutto pronto!</p></div>
              : daPreparare.map(item=>{
                  const st=(item.status||{})[activePers]||'ok';
                  const bagNames=item.valigie.filter(x=>myActiveVIds.includes(x.id)).map(x=>valigie.find(v=>v.id===x.id)?.nome).filter(Boolean).join(', ');
                  return(
                    <div key={item.id} className="card-sm" style={{marginBottom:8,padding:'10px 14px',display:'flex',alignItems:'center',gap:10}}>
                      <button className={`ds-status ${statusClass(st)}`}
                        style={{fontSize:10,padding:'2px 7px',minWidth:32,flexShrink:0}}
                        onClick={()=>toggleVPStatusPers(item.id,activePers)}>
                        {statusIcon(st)}
                      </button>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:13,fontWeight:600}}>{item.name}</div>
                        <div style={{fontSize:10,color:'var(--text3)'}}>{bagNames}</div>
                        {item.note&&<div style={{fontSize:10,color:'var(--text2)'}}>{item.note}</div>}
                      </div>
                      <span style={{fontSize:11,color:'var(--text3)',fontWeight:600}}>{statusLabel(st)}</span>
                    </div>
                  );
                })
            }
          </div>
        )}
      </div>
    );
  };

  // ── TAB: TAG ──────────────────────────────────────────────────────────

            const file=e.target.files[0]; if(!file) return;
            const reader=new FileReader();
            reader.onload=ev=>{
              try{
                const d=JSON.parse(ev.target.result);
                if(!confirm('Importare i dati? Verranno sovrascritti i dati attuali.')) return;
                upd({
                  categories: d.categories || cats,
                  products:   d.products   || prods,
                  spesaManuale: d.spesaManuale || spesa,
                  persone:    d.persone    || persone,
                  valigie:    d.valigie    || valigie,
                  valigieProdotti: d.valigieProdotti || valProd,
                  tags:            d.tags            || tags,
                  luoghi:          d.luoghi          || luoghi,

            reader.readAsText(file);

              <label className="field-label">Icona</label>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {DISP_BAG_ICONS.map(ic=>(
                  <button key={ic} onClick={()=>setData('icon')(ic)}
                    style={{fontSize:22,padding:'6px',borderRadius:8,border:'2px solid '+(v.icon===ic?'var(--primary)':'var(--border)'),background:v.icon===ic?'var(--primary-faint)':'var(--card)',cursor:'pointer'}}>
                    {ic}
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div className="btn-row">
            <button className="btn-primary" onClick={()=>{if(!v.nome.trim()){alert('Inserisci il nome');return;}saveValigia(v);}}>✓ Salva</button>
            {v.id&&<button className="btn" style={{color:'var(--red)'}} onClick={()=>delValigia(v.id)}>🗑️</button>}
            <button className="btn" onClick={()=>setModal(null)}>Annulla</button>
          </div>
        </Modal>
      );
    }

    if(type==='vpItem'){
      const item=data;
      const pid=activePers;
      // Tutte le valigie delle persone attive (per scegliere associazioni)
      const allPersoneV = valigie;
      const toggleValigia = (vid) => {
        const cur = item.valigie||[];
        const exists = cur.find(x=>x.id===vid);
        setModal(m=>({...m,data:{...m.data,valigie: exists ? cur.filter(x=>x.id!==vid) : [...cur,{id:vid,qty:''}]}}));
      };
      const setQty = (vid,q) => {
        setModal(m=>({...m,data:{...m.data,valigie:(m.data.valigie||[]).map(x=>x.id===vid?{...x,qty:q}:x)}}));
      };
      const toggleDis = () => {
        const cur=item.disabled||{};
        setModal(m=>({...m,data:{...m.data,disabled:{...cur,[pid]:!cur[pid]}}}));
      };
      const curDis=(item.disabled||{})[pid]||false;
      // Raggruppa valigie per persona
      const personeAttive = persone.filter(p=>!p.disabled);
      return(
        <Modal title={item.id?'Modifica Articolo':'Nuovo Articolo'} onClose={()=>setModal(null)} width="420px">
          <div className="form-grid" style={{gap:10}}>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Nome *</label>
              <input className="field-input" value={item.name} onChange={e=>setData('name')(e.target.value)} placeholder="Nome articolo"/>
            </div>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Note</label>
              <input className="field-input" value={item.note||''} onChange={e=>setData('note')(e.target.value)} placeholder="Note opzionali"/>
            </div>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">🧳 Valigie associate (e quantità)</label>
              {personeAttive.map(p=>{
                const pValigie=allPersoneV.filter(v=>v.personaId===p.id);
                if(!pValigie.length) return null;
                return(
                  <div key={p.id} style={{marginBottom:8}}>
                    <div style={{fontSize:11,color:p.colore,fontWeight:700,marginBottom:4}}>{p.nome}</div>
                    {pValigie.map(v=>{
                      const checked=!!(item.valigie||[]).find(x=>x.id===v.id);
                      const qtyVal=(item.valigie||[]).find(x=>x.id===v.id)?.qty||'';
                      return(
                        <div key={v.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                          <button onClick={()=>toggleValigia(v.id)}
                            style={{width:20,height:20,borderRadius:4,border:'2px solid '+(checked?'var(--primary)':'var(--border)'),
                              background:checked?'var(--primary)':'transparent',cursor:'pointer',flexShrink:0,
                              display:'flex',alignItems:'center',justifyContent:'center',color:'var(--bg)',fontSize:12,fontWeight:700}}>
                            {checked?'✓':''}
                          </button>
                          <span style={{fontSize:12,flex:1}}>{v.icon||'🧳'} {v.nome}</span>
                          {checked&&(
                            <input type="text" value={qtyVal} onChange={e=>setQty(v.id,e.target.value)}
                              placeholder="Qtà" style={{width:60,padding:'3px 7px',borderRadius:6,border:'1px solid var(--border)',
                                background:'var(--input)',color:'var(--text)',fontSize:12}}/>
                          )}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
            {item.id&&(
              <div className="field" style={{gridColumn:'1/-1',display:'flex',alignItems:'center',gap:12}}>
                <label style={{fontSize:13,flex:1}}>Disattiva per {persone.find(p=>p.id===pid)?.nome||'te'}</label>
                <button className={`btn${!curDis?' btn-primary':''}`} style={{padding:'5px 12px',fontSize:12}}
                  onClick={toggleDis}>{!curDis?'Attivo':'Disattivato'}</button>
              </div>
            )}
            {visibleTags.length>0&&(
              <div className="field" style={{gridColumn:'1/-1'}}>
                <label className="field-label">🏷️ Tag</label>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {visibleTags.map(t=>{
                    const on=(item.tags||[]).includes(t.id);
                    return(
                      <button key={t.id} onClick={()=>setData('tags')(on?(item.tags||[]).filter(x=>x!==t.id):[...(item.tags||[]),t.id])}
                        style={{padding:'4px 10px',borderRadius:16,fontSize:11,fontWeight:600,cursor:'pointer',
                          border:'2px solid '+t.color,background:on?t.color:'transparent',color:on?'var(--bg)':t.color}}>
                        {t.type==='personal'?'👤 ':''}{t.name}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
          <div className="btn-row">
            <button className="btn-primary" onClick={()=>{
              if(!item.name.trim()){alert('Inserisci il nome');return;}
              if(!(item.valigie||[]).length){alert('Associa almeno una valigia');return;}
              saveVP(item);
            }}>✓ Salva</button>
            {item.id&&<button className="btn" style={{color:'var(--red)'}} onClick={()=>delVP(item.id)}>🗑️</button>}
            <button className="btn" onClick={()=>setModal(null)}>Annulla</button>
          </div>
        </Modal>
      );
    }
    if(type==='luogo'){
      const l=data;
      return(
        <Modal title={l.id?'Modifica Luogo':'Nuovo Luogo'} onClose={()=>setModal(null)} width="380px">
          <div className="form-grid" style={{gap:10}}>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Nome *</label>
              <input className="field-input" value={l.nome} onChange={e=>setData('nome')(e.target.value)} placeholder="es. Pensile cucina, Frigo, Bagagliaio…"/>
            </div>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Icona</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {['🏠','🧊','🍽️','🔧','📦','🛁','🚐','⛺','🪣','🗄️','🧺','💊','🔌','📍'].map(em=>(
                  <div key={em} onClick={()=>setData('icona')(em)}
                    style={{width:36,height:36,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',
                      fontSize:20,cursor:'pointer',border:'2px solid '+(l.icona===em?'var(--primary)':'var(--border)'),
                      background:l.icona===em?'var(--primary-faint)':'var(--card)'}}>
                    {em}
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div className="btn-row">
            <button className="btn-primary" onClick={()=>{if(!l.nome.trim()){alert('Inserisci il nome');return;}saveLuogo(l);}}>✓ Salva</button>
            {l.id&&<button className="btn" style={{color:'var(--red)'}} onClick={()=>{if(!confirm('Eliminare luogo? I prodotti resteranno ma perderanno il luogo.'))return;deleteLuogo(l.id);}}>🗑️</button>}
            <button className="btn" onClick={()=>setModal(null)}>Annulla</button>
          </div>
        </Modal>
      );
    }
    if(type==='tag'){
      const t=data;
      const canChange = t.type==='global' ? isAdmin : true;
      return(
        <Modal title={t.id?'Modifica Tag':'Nuovo Tag'} onClose={()=>setModal(null)} width="400px">
          <div className="form-grid" style={{gap:10}}>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Nome *</label>
              <input className="field-input" value={t.name} onChange={e=>setData('name')(e.target.value)} placeholder="es. Urgente, Mare, Farmaci"/>
            </div>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Colore</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {TAG_COLORS.map(col=>(
                  <div key={col} onClick={()=>setData('color')(col)}
                    style={{width:28,height:28,borderRadius:14,background:col,cursor:'pointer',
                      border:'3px solid '+(t.color===col?'#fff':'transparent'),
                      boxShadow:t.color===col?'0 0 0 2px '+col:'none'}}/>
                ))}
              </div>
            </div>
            {!t.id&&isAdmin&&(
              <div className="field" style={{gridColumn:'1/-1'}}>
                <label className="field-label">Tipo</label>
                <div style={{display:'flex',gap:8}}>
                  {[['global','🌐 Globale (tutti)'],['personal','👤 Personale (solo io)']].map(([v,lbl])=>(
                    <button key={v} onClick={()=>setData('type')(v)}
                      style={{flex:1,padding:'7px',borderRadius:8,fontSize:12,fontWeight:600,cursor:'pointer',
                        border:'2px solid '+(t.type===v?'var(--primary)':'var(--border)'),
                        background:t.type===v?'var(--primary-faint)':'var(--card)',
                        color:t.type===v?'var(--primary)':'var(--text2)'}}>
                      {lbl}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
          <div className="btn-row">
            <button className="btn-primary" onClick={()=>{if(!t.name.trim()){alert('Inserisci il nome');return;}saveTag(t);}}>✓ Salva</button>
            {t.id&&canChange&&<button className="btn" style={{color:'var(--red)'}} onClick={()=>delTag(t.id)}>🗑️</button>}
            <button className="btn" onClick={()=>setModal(null)}>Annulla</button>
          </div>
        </Modal>
      );
    }
    return null;
  };

  const TABS=[['inventario','📦','Inventario'],['spesa','🛒','Spesa'],['tag','🏷️','Tag'],['portare','🏠','Portare'],['valigie','🧳','Valigie'],['impostazioni','⚙️','Impost.']];
  return(
    <div>
      {/* Header */}
      <div className="app-header" style={{height:'auto',flexDirection:'column',alignItems:'stretch',padding:'8px 12px 0',gap:0}}>
        {/* Riga 1: titolo e condividi */}
        <div style={{display:'flex',alignItems:'center',gap:8,paddingBottom:8}}>
          <button className="btn-icon" onClick={onBack} style={{flexShrink:0}}>←</button>
          <div className="logo" style={{fontSize:15,flex:1}}>🏕️ <strong>Dispensa Camper</strong></div>
          <button className="btn-icon" onClick={()=>setShowShare(true)} title="Condividi" style={{flexShrink:0}}>👥</button>
        </div>
        {/* Riga 2: tab con icona sopra e testo sotto */}
        <div style={{display:'flex',borderTop:'1px solid var(--border)'}}>
          {TABS.map(([t,ic,label])=>(
            <button key={t} onClick={()=>setTab(t)}
              style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                gap:2,padding:'8px 2px 6px',border:'none',borderBottom:`2.5px solid ${tab===t?'var(--primary)':'transparent'}`,
                background:'transparent',cursor:'pointer',color:tab===t?'var(--primary)':'var(--text3)',transition:'color .15s'}}>
              <span style={{fontSize:20,lineHeight:1}}>{ic}</span>
              <span style={{fontSize:9,fontWeight:600,letterSpacing:.3}}>{label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div className="container">
        {tab==='inventario' && <TabInventario/>}
        {tab==='spesa'      && <TabSpesa/>}
        {tab==='tag'        && <TabTag/>}
        {tab==='portare'    && <TabPortare/>}
        {tab==='valigie'    && <TabValigie/>}
        {tab==='impostazioni' && <TabImpostazioni/>}
      </div>

      {/* Modals */}
      {renderModal()}
      {showShare && <DispensaShareModal dispensa={dispensa} dispensaId={dispensaId} user={user} onClose={()=>setShowShare(false)}/>}
    </div>
  );
}

// ── Home View / App ────────────────────────────────────────────────────────
function App(){
  const [user,setUser]         = React.useState(undefined);
  const [viaggi,setViaggi]     = React.useState([]);
  const [dispensa,setDispensa] = React.useState(null);
  const [dispId,setDispId]     = React.useState(null);
  const [activeId,setActiveId] = React.useState(null);
  const [showDisp,setShowDisp]   = React.useState(false);
  const [showViaggi,setShowViaggi] = React.useState(false);
  const [showNew,setNew]       = React.useState(false);
  const [delId,setDel]         = React.useState(null);
  const [showShare,setShare]   = React.useState(null);

  React.useEffect(()=>{
    return firebase.auth().onAuthStateChanged(u=>setUser(u||null));
  },[]);

  React.useEffect(()=>{
    if(user===undefined) return;
    if(!user){ setViaggi([]); setDispensa(null); setDispId(null); return; }
    // Salva profilo utente
    firebase.firestore().collection('users').doc(user.uid)
      .set({email:user.email.toLowerCase(), displayName:user.displayName||user.email},{merge:true});
    // Listener viaggi
    const unsubV = firebase.firestore().collection('viaggi')
      .where('members','array-contains',user.uid)
      .onSnapshot(snap=>{
        const list = snap.docs.map(d=>({...d.data(),id:d.id}));
        list.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
        setViaggi(list);
      }, err=>console.error('viaggi err:',err));
    // Listener dispensa
    const unsubD = firebase.firestore().collection('dispensa')
      .where('members','array-contains',user.uid)
      .onSnapshot(async snap=>{
        if(snap.empty){
          try {
            const doc = mkDispensaDoc(user.uid, user.email.toLowerCase());
            const ref = await firebase.firestore().collection('dispensa').add({
              ...doc, createdAt:firebase.firestore.FieldValue.serverTimestamp()
            });
            setDispId(ref.id); setDispensa(doc);
          } catch(e){ console.error('creaDispensa err:',e); }
        } else {
          setDispId(snap.docs[0].id);
          setDispensa(snap.docs[0].data());
        }
      }, err=>console.error('dispensa err:',err));
    return ()=>{ unsubV(); unsubD(); };
  },[user]);

  const updateTrip = t => {
    const {id,...data}=t;
    firebase.firestore().collection('viaggi').doc(id).update(data).catch(e=>console.error(e));
  };
  const addTrip = form => {
    const trip=createTrip(form); const {id:_,...data}=trip;
    firebase.firestore().collection('viaggi').add({
      ...data, ownerId:user.uid, members:[user.uid],
      memberEmails:[user.email.toLowerCase()],
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    }).catch(e=>console.error(e));
  };
  const removeTrip = id => firebase.firestore().collection('viaggi').doc(id).delete().catch(e=>console.error(e));
  const updateDispensa = data => {
    if(!dispId) return;
    const {id:_,createdAt:__,...rest}=data;
    firebase.firestore().collection('dispensa').doc(dispId).update(rest).catch(e=>console.error(e));
  };
  const strutture = dispensa?.strutture || [];
  const onUpdateStrutture = list => { if(dispId) updateDispensa({...dispensa, strutture:list}); };
  const veicoli = dispensa?.veicoli || [];
  const onUpdateVeicoli = list => { if(dispId) updateDispensa({...dispensa, veicoli:list}); };
  const signOut = () => firebase.auth().signOut();

  // Loading
  if(user===undefined) return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:14,background:'var(--bg)'}}>
      <div style={{fontSize:40}}>🚐</div>
      <div style={{color:'var(--text2)',fontSize:13}}>Caricamento...</div>
    </div>
  );

  if(!user) return <LoginScreen/>;

  // Dispensa view
  if(showDisp && dispensa) return(
    <DispensaView dispensa={dispensa} dispensaId={dispId} updateDispensa={updateDispensa} user={user} onBack={()=>setShowDisp(false)}/>
  );

  // Trip view
  if(activeId){
    const v=viaggi.find(x=>x.id===activeId);
    if(!v){ setActiveId(null); return null; }
    const gruppiEsistenti = [...new Set(viaggi.map(v=>(v.gruppo||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));
    return <TripView viaggio={v} updateTrip={updateTrip} back={()=>setActiveId(null)} user={user} onShare={()=>setShare(v)} gruppiEsistenti={gruppiEsistenti} strutture={strutture} onUpdateStrutture={onUpdateStrutture} veicoli={veicoli} onUpdateVeicoli={onUpdateVeicoli}/>;
  }

  // Viaggi section
  if(showViaggi) return(
    <ViaggiaSection
      viaggi={viaggi} user={user} signOut={signOut}
      onBack={()=>setShowViaggi(false)}
      onOpen={id=>setActiveId(id)}
      showNew={showNew} setNew={setNew}
      delId={delId} setDel={setDel}
      showShare={showShare} setShare={setShare}
      addTrip={addTrip} removeTrip={removeTrip} updateTrip={updateTrip}
      strutture={strutture} onUpdateStrutture={onUpdateStrutture}
      veicoli={veicoli} onUpdateVeicoli={onUpdateVeicoli}
    />
  );

  // Home — due card
  const dispStats = dispensa ? {
    tot:(dispensa.products||[]).filter(p=>!p.disabled).length,
    low:(dispensa.products||[]).filter(p=>!p.disabled&&p.status==='low').length,
    out:(dispensa.products||[]).filter(p=>!p.disabled&&p.status==='out').length,
    buy:(dispensa.products||[]).filter(p=>!p.disabled&&p.toBuy).length,
  } : null;

  return(
    <div>
      <div className="app-header">
        <div className="logo">🚐 <strong>CamperHub</strong> <span>v9.10</span></div>
        <div className="header-actions">
          <button className="btn-icon" onClick={signOut} title="Esci" style={{fontSize:16}}>🚪</button>
        </div>
      </div>

      <div className="container">
        <div style={{fontSize:11,color:'var(--text3)',marginBottom:20,display:'flex',alignItems:'center',gap:6}}>
          <span>👤</span><span>{user.email}</span>
        </div>

        {/* Card Viaggi */}
        <div className="ds-hub-card" onClick={()=>setShowViaggi(true)}
          style={{borderColor: viaggi.length>0 ? 'var(--primary-dim)' : 'var(--border2)'}}>
          <div style={{fontSize:36,flexShrink:0}}>🚐</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:16,fontWeight:700,color:'var(--primary)',fontFamily:"'Syne',sans-serif"}}>I miei viaggi</div>
            <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>
              {viaggi.length===0 ? 'Nessun viaggio — creane uno!' : `${viaggi.length} ${viaggi.length===1?'viaggio':'viaggi'} in archivio`}
            </div>
          </div>
          <span style={{color:'var(--text3)',fontSize:22}}>›</span>
        </div>

        {/* Card Dispensa */}
        <div className="ds-hub-card" onClick={()=>setShowDisp(true)}>
          <div style={{fontSize:36,flexShrink:0}}>🏕️</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:16,fontWeight:700,color:'var(--primary)',fontFamily:"'Syne',sans-serif"}}>Dispensa Camper</div>
            {dispStats
              ? <div style={{fontSize:12,color:'var(--text2)',marginTop:2,display:'flex',gap:8,flexWrap:'wrap'}}>
                  <span>{dispStats.tot} prodotti</span>
                  {dispStats.low>0&&<span style={{color:'var(--accent)'}}>⚠️ {dispStats.low} scarsi</span>}
                  {dispStats.out>0&&<span style={{color:'var(--red)'}}>❌ {dispStats.out} mancanti</span>}
                  {dispStats.buy>0&&<span style={{color:'var(--primary)'}}>🛒 {dispStats.buy} da comprare</span>}
                </div>
              : <div style={{fontSize:12,color:'var(--text3)'}}>Caricamento...</div>
            }
          </div>
          <span style={{color:'var(--text3)',fontSize:22}}>›</span>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
