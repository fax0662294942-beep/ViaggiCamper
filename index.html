// ── New / Edit Trip Modal ─────────────────────────────────────────────────
function TripFormModal({initial, title, onClose, onSave, isCopy, gruppiEsistenti=[], sottogruppiMap={}, veicoli=[], onAddVeicolo}){
  const today = new Date().toISOString().slice(0,10);
  const [f,setF] = React.useState(initial ? {
    nome: initial.nome||(isCopy?initial.nome+' (copia)':''),
    budget: initial.budget||1000,
    startDate: initial.startDate||today,
    endDate: initial.endDate||addDays(today,6),
    veicolo: initial.veicolo||'',
    veicoloId: initial.veicoloId||null,
    consumoMedio: initial.consumoMedio||0,
    status: initial.status||'ipotesi',
    gruppo: initial.gruppo||'',
    sottogruppo: initial.sottogruppo||'',
  } : {nome:'',budget:1000,startDate:today,endDate:addDays(today,6),veicolo:'',veicoloId:null,consumoMedio:0,status:'ipotesi',gruppo:'',sottogruppo:''});
  const [nuovoGruppo, setNuovoGruppo] = React.useState(
    !!(initial?.gruppo && !gruppiEsistenti.includes(initial.gruppo))
  );
  const [nuovoSottogruppo, setNuovoSG] = React.useState(false);
  const u=(k,v)=>setF(p=>({...p,[k]:v}));
  const giorni = diffInclusive(f.startDate, f.endDate);
  // Sottogruppi esistenti per il gruppo corrente
  const sottogruppiEsistenti = f.gruppo ? (sottogruppiMap[f.gruppo] || []) : [];
  const save=()=>{
    if(!f.nome.trim()) return alert("Inserisci il nome del viaggio");
    if(giorni<1) return alert("Le date non sono valide");
    onSave(f); onClose();
  };
  const onSelectGruppo = val => {
    if(val==='__nuovo__'){ setNuovoGruppo(true); u('gruppo',''); }
    else { setNuovoGruppo(false); u('gruppo',val); u('sottogruppo',''); setNuovoSG(false); }
  };
  return (
    <Modal title={title} onClose={onClose} width="460px">
      <div className="form-grid">
        {/* Stato */}
        <div className="field" style={{gridColumn:"1/-1"}}>
          <label className="field-label">Stato</label>
          <div style={{display:'flex',gap:8}}>
            {[['ipotesi','💭 Ipotesi'],['confermato','✅ Confermato']].map(([s,l])=>(
              <button key={s} onClick={()=>u('status',s)}
                style={{flex:1,padding:'8px',borderRadius:8,border:'1.5px solid '+(f.status===s?'var(--primary-dim)':'var(--border2)'),
                  background:f.status===s?'var(--primary-faint)':'var(--card)',
                  color:f.status===s?'var(--primary)':'var(--text2)',fontSize:13,fontWeight:600,cursor:'pointer'}}>
                {l}
              </button>
            ))}
          </div>
        </div>
        {/* Gruppo / evento */}
        <div className="field" style={{gridColumn:"1/-1"}}>
          <label className="field-label">📁 Gruppo / Evento</label>
          {!nuovoGruppo ? (
            <select className="field-input" value={f.gruppo||''} onChange={e=>onSelectGruppo(e.target.value)}>
              <option value="">— Nessun gruppo —</option>
              {gruppiEsistenti.map(g=><option key={g} value={g}>{g}</option>)}
              <option value="__nuovo__">➕ Crea nuovo gruppo...</option>
            </select>
          ) : (
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <input type="text" className="field-input" style={{flex:1}} autoFocus
                value={f.gruppo||''} onChange={e=>u('gruppo',e.target.value)}
                placeholder="es. Ferie agosto, Pasqua, Ponte 1 maggio..."/>
              {gruppiEsistenti.length>0&&(
                <button className="btn" style={{flexShrink:0,padding:'8px 10px',fontSize:12}}
                  onClick={()=>setNuovoGruppo(false)}>← Lista</button>
              )}
            </div>
          )}
        </div>
        {/* Sottogruppo — visibile se gruppo selezionato */}
        {f.gruppo&&(
          <div className="field" style={{gridColumn:"1/-1"}}>
            <label className="field-label">📂 Sotto-gruppo (opzionale)</label>
            {!nuovoSottogruppo && sottogruppiEsistenti.length>0 ? (
              <select className="field-input" value={f.sottogruppo||''}
                onChange={e=>{
                  if(e.target.value==='__nuovo__'){setNuovoSG(true);u('sottogruppo','');}
                  else u('sottogruppo',e.target.value);
                }}>
                <option value="">— Nessun sotto-gruppo —</option>
                {sottogruppiEsistenti.map(sg=><option key={sg} value={sg}>{sg}</option>)}
                <option value="__nuovo__">➕ Crea nuovo...</option>
              </select>
            ) : (
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <input type="text" className="field-input" style={{flex:1}}
                  autoFocus={nuovoSottogruppo}
                  value={f.sottogruppo||''} onChange={e=>u('sottogruppo',e.target.value)}
                  placeholder="es. Settimana 1, Tappa Nord..."/>
                {sottogruppiEsistenti.length>0&&(
                  <button className="btn" style={{flexShrink:0,padding:'8px 10px',fontSize:12}}
                    onClick={()=>{setNuovoSG(false);u('sottogruppo','');}}>← Lista</button>
                )}
              </div>
            )}
            {f.sottogruppo&&(
              <div style={{fontSize:10,color:'var(--text3)',marginTop:3}}>
                📁 {f.gruppo} › 📂 {f.sottogruppo}
              </div>
            )}
          </div>
        )}
        <div className="field" style={{gridColumn:"1/-1"}}>
          <label className="field-label">Nome viaggio</label>
          <input type="text" className="field-input" value={f.nome} onChange={e=>u("nome",e.target.value)} placeholder="es. Puglia, Val Gardena, Toscana..."/>
        </div>
        <div className="field" style={{gridColumn:"1/-1"}}>
          <label className="field-label">Budget iniziale €</label>
          <input type="number" className="field-input" value={f.budget} onFocus={e=>e.target.select()} onChange={e=>u("budget",+e.target.value||0)}/>
        </div>
        <div className="field">
          <label className="field-label">Partenza</label>
          <input type="date" className="field-input" value={f.startDate} onChange={e=>u("startDate",e.target.value)}/>
        </div>
        <div className="field">
          <label className="field-label">Rientro</label>
          <input type="date" className="field-input" value={f.endDate} onChange={e=>u("endDate",e.target.value)}/>
        </div>
        <VeicoloPicker veicoli={veicoli} veicoloId={f.veicoloId} veicoloText={f.veicolo}
          onSelect={v=>{
            if(!v){u('veicoloId',null);return;}
            setF(p=>({...p,veicoloId:v.id,veicolo:v.nome,consumoMedio:v.consumoMedio||p.consumoMedio}));
          }}
          onAddNew={nome=>{
            if(onAddVeicolo) onAddVeicolo(nome, newV=>{
              setF(p=>({...p,veicoloId:newV.id,veicolo:newV.nome,consumoMedio:newV.consumoMedio||p.consumoMedio}));
            });
          }}/>
        <div className="field" style={{gridColumn:"1/-1"}}>
          <label className="field-label">Consumo medio (l/100km) {f.veicoloId&&veicoli.find(v=>v.id===f.veicoloId)?<span style={{fontSize:10,color:'var(--text3)'}}>· da predefinito veicolo, modificabile</span>:''}</label>
          <input type="number" className="field-input" value={f.consumoMedio||""} placeholder="es. 12"
            onFocus={e=>e.target.select()} onChange={e=>u("consumoMedio",+e.target.value||0)}/>
        </div>
      </div>
      {giorni>0 && <p style={{marginTop:12,fontSize:12,color:"var(--text2)"}}>⏱ {giorni} giorni · max {MAX_DAYS} giorni supportati</p>}
      <div className="btn-row">
        <button className="btn-primary" onClick={save}>✓ Salva</button>
        <button className="btn" onClick={onClose}>Annulla</button>
      </div>
    </Modal>
  );
}

// ── FillDaysModal ────────────────────────────────────────────────────────────
const FILL_CATS = [
  {k:'spesa',    label:'🛒 Spesa',       color:'#4fd8b4'},
  {k:'colazione',label:'☕ Colazione',    color:'#f0a045'},
  {k:'cena',     label:'🍽️ Pranzo/Cena', color:'#f06060'},
  {k:'extraVar', label:'➕ Extra',        color:'#a855f7'},
];
function FillDaysModal({data, onApply, onClose}){
  const [cat,    setCat]    = React.useState('spesa');
  const [amount, setAmount] = React.useState('');
  const [sel,    setSel]    = React.useState(new Set());

  const toggleDay = i => setSel(s=>{ const ns=new Set(s); ns.has(i)?ns.delete(i):ns.add(i); return ns; });
  const toggleAll = () => setSel(s=>s.size===data.length?new Set():new Set(data.map((_,i)=>i)));
  const catInfo = FILL_CATS.find(c=>c.k===cat)||FILL_CATS[0];

  return(
    <Modal title="⚡ Riempi giorni" onClose={onClose} width="480px">
      {/* Categoria */}
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {FILL_CATS.map(c=>(
          <button key={c.k} onClick={()=>setCat(c.k)}
            style={{padding:'6px 12px',borderRadius:20,fontSize:12,fontWeight:600,cursor:'pointer',
              border:'1.5px solid '+(cat===c.k?c.color:'var(--border)'),
              background:cat===c.k?c.color+'22':'transparent',
              color:cat===c.k?c.color:'var(--text2)'}}>
            {c.label}
          </button>
        ))}
      </div>

      {/* Importo */}
      <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:14}}>
        <label style={{fontSize:13,color:'var(--text2)',flexShrink:0}}>Importo €</label>
        <input type="number" className="field-input" style={{flex:1,fontSize:16,fontWeight:700,color:catInfo.color}}
          value={amount} placeholder="es. 32"
          onFocus={e=>e.target.select()} onChange={e=>setAmount(e.target.value)}/>
      </div>

      {/* Lista giorni */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:12,color:'var(--text2)'}}>
          Seleziona i giorni · <strong>{sel.size}</strong> selezionati
        </div>
        <button className="btn" style={{fontSize:11,padding:'4px 10px'}} onClick={toggleAll}>
          {sel.size===data.length?'Deseleziona tutti':'Seleziona tutti'}
        </button>
      </div>
      <div style={{maxHeight:280,overflowY:'auto',border:'1px solid var(--border)',borderRadius:10,marginBottom:14}}>
        {data.map((d,i)=>{
          const isSel=sel.has(i);
          const existing=n(d[cat]);
          return(
            <div key={d.date} onClick={()=>toggleDay(i)}
              style={{display:'flex',alignItems:'center',gap:10,padding:'9px 14px',cursor:'pointer',
                borderBottom:i<data.length-1?'1px solid var(--border)':'none',
                background:isSel?catInfo.color+'11':'transparent'}}>
              <div style={{width:20,height:20,borderRadius:4,flexShrink:0,
                border:'2px solid '+(isSel?catInfo.color:'var(--border)'),
                background:isSel?catInfo.color:'transparent',
                display:'flex',alignItems:'center',justifyContent:'center',
                color:'var(--bg)',fontSize:12,fontWeight:700}}>
                {isSel?'✓':''}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:600}}>G{i+1} — {fmtDate(d.date)}</div>
                {d.idTappa&&<div style={{fontSize:10,color:'var(--text3)'}}>📍 {d.luogo||d.struttura||d.idTappa}</div>}
              </div>
              {existing>0&&(
                <div style={{fontSize:11,color:'var(--text3)'}}>
                  già: <strong style={{color:isSel?catInfo.color:'var(--text2)'}}>€{existing}</strong>
                  {isSel&&<span style={{color:catInfo.color}}> → €{amount||'?'}</span>}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="btn-row">
        <button className="btn-primary"
          style={{background:catInfo.color,borderColor:catInfo.color}}
          onClick={()=>{
            if(!amount||!sel.size){alert('Inserisci importo e seleziona almeno un giorno');return;}
            onApply(cat,+amount,[...sel]);
            onClose();
          }}>
          ✓ Applica a {sel.size} {sel.size===1?'giorno':'giorni'}
        </button>
        <button className="btn" onClick={onClose}>Annulla</button>
      </div>
    </Modal>
  );
}

// ── Trip View ──────────────────────────────────────────────────────────────
function TripView({viaggio, updateTrip, back, user, onShare, gruppiEsistenti=[], strutture=[], onUpdateStrutture, veicoli=[], onUpdateVeicoli}){
  useBack(back);
  const [tab, setTab]           = React.useState("preventivo");
  const [showTappa, setTappa]   = React.useState(false);
  const [editingTappa, setEditingTappa] = React.useState(null); // tappa object to edit
  const [showEdit, setEdit]     = React.useState(false);
  const [delTappa, setDelTappa] = React.useState(null);
  const [showStats, setStats]   = React.useState(true);
  const [showChart, setChart]   = React.useState(false);
  const [fsGrid, setFsGrid]     = React.useState(false);
  const [dayModal, setDayModal] = React.useState(null);
  const [viewMode, setViewMode] = React.useState("panoramica");
  const [showFillDays, setShowFillDays] = React.useState(false);
  const data = viaggio[tab];

  const fillDays = (cat, amount, indices) => {
    const copy = {...viaggio,[tab]:[...viaggio[tab]]};
    indices.forEach(i=>{ copy[tab][i]={...copy[tab][i],[cat]:amount}; });
    updateTrip(copy);
  };

  const updateCell = (i,k,v) => {
    if(k==="__nav__"){ setDayModal(i); return; } // navigate day in modal
    const copy = {...viaggio,[tab]:[...viaggio[tab]]};
    copy[tab][i] = {...copy[tab][i],[k]:v};
    updateTrip(copy);
  };

  const addTappa = form => {
    const norm = d => (d||"").slice(0,10);
    const sIdx = viaggio[tab].findIndex(d=>norm(d.date)===norm(form.startDate));
    const eIdx = viaggio[tab].findIndex(d=>norm(d.date)===norm(form.endDate));
    if(sIdx===-1||eIdx===-1||eIdx<sIdx){ alert("Controlla le date della tappa (devono rientrare nel periodo del viaggio)"); return; }
    const copy  = {...viaggio,[tab]:[...viaggio[tab]],tappe:[...(viaggio.tappe||[])]};
    const idN   = (viaggio.tappe||[]).filter(x=>x.target===tab).length+1;
    const idT   = `T${idN}`;
    const isTransit = eIdx===sIdx; // tappa di transito: stessa giornata
    const piaz  = isTransit ? 0 : n(form.costoPiazzola)+n(form.costoPersona)*n(form.numeroPersone)+n(form.elettricita)+n(form.moto);
    const tassa = isTransit ? 0 : n(form.tassaSoggiorno)*n(form.numeroPersone);
    const doccia = isTransit ? 0 : n(form.costoDoccia);
    // salvo il suo pagamento checkout come campo separato prima di sovrascrivere
    const dayAtSIdx = copy[tab][sIdx];
    let pagamentoCheckoutPrev = 0;
    let prevIdTappa = "";
    if(dayAtSIdx.idTappa && dayAtSIdx.idTappa !== idT){
      prevIdTappa = dayAtSIdx.idTappa;
      pagamentoCheckoutPrev = copy[tab].reduce((a,x)=>x.idTappa===prevIdTappa?a+n(x.piazzola)+n(x.tassa):a,0);
    }

    for(let i=sIdx;i<eIdx;i++){
      copy[tab][i]={...copy[tab][i],idTappa:idT,luogo:form.luogo,struttura:form.struttura,piazzola:piaz,tassa,doccia,extraStruttura:n(form.extraStruttura),pagamentoCheckoutPrev:0,prevIdTappa:""};
    }
    // checkout day (o giorno unico se transito)
    if(isTransit){
      copy[tab][sIdx]={...copy[tab][sIdx],idTappa:idT,luogo:form.luogo,struttura:form.struttura,piazzola:0,tassa:0,doccia:0,extraStruttura:0,pagamentoCheckoutPrev:0,prevIdTappa:""};
    } else {
      copy[tab][eIdx]={...copy[tab][eIdx],idTappa:idT,luogo:form.luogo,struttura:form.struttura,piazzola:0,tassa:0,doccia:0,extraStruttura:0,pagamentoCheckoutPrev:0,prevIdTappa:""};
    }

    if(pagamentoCheckoutPrev > 0){
      copy[tab][sIdx]={...copy[tab][sIdx], pagamentoCheckoutPrev, prevIdTappa};
    }

    // Km e carburante:
    // - tappa normale → giorno PRIMA del check-in (come sempre)
    // - tappa di transito → giorno STESSO (non c'è "prima"), somma se già presenti
    const fuelIdx = isTransit ? sIdx : (sIdx > 0 ? sIdx - 1 : sIdx);
    if(n(form.kmTappa)>0){
      const kmPrev = isTransit ? n(copy[tab][fuelIdx].km) : 0;
      copy[tab][fuelIdx]={...copy[tab][fuelIdx], km: kmPrev + n(form.kmTappa)};
    }
    if(n(form.costoCarburante)>0){
      const gasPrev = isTransit ? n(copy[tab][fuelIdx].gasolio) : 0;
      copy[tab][fuelIdx]={...copy[tab][fuelIdx], gasolio: gasPrev + n(form.costoCarburante)};
    }
    // Traghetto → somma sempre (può coesistere con altri costi nello stesso giorno)
    if(n(form.costoTraghetto)>0){
      const tragIdx = isTransit ? sIdx : (form.traghettoGiorno==='arrivo' ? sIdx : fuelIdx);
      copy[tab][tragIdx]={...copy[tab][tragIdx], traghetto: n(copy[tab][tragIdx].traghetto) + n(form.costoTraghetto)};
    }

    copy.tappe.push({...form,id:Date.now(),target:tab,idTappa:idT});
    updateTrip(copy);
    setTappa(false);
  };

  const removeTappa = (tappa) => {
    const copy = {...viaggio,[tab]:[...viaggio[tab]],tappe:(viaggio.tappe||[]).filter(t=>t.id!==tappa.id)};
    copy[tab] = copy[tab].map(d => {
      if(d.idTappa !== tappa.idTappa) return d;
      if(d.prevIdTappa){
        const prevT = (viaggio.tappe||[]).find(t=>t.idTappa===d.prevIdTappa);
        return {...d, idTappa:d.prevIdTappa, luogo:prevT?.luogo||"", struttura:prevT?.struttura||"",
          piazzola:0, tassa:0, doccia:0, extraStruttura:0, pagamentoCheckoutPrev:0, prevIdTappa:""};
      }
      return {...d, idTappa:"", luogo:"", struttura:"", piazzola:0, tassa:0, doccia:0, extraStruttura:0, pagamentoCheckoutPrev:0, prevIdTappa:""};
    });
    updateTrip(copy);
  };

  const editTappaFn = (oldTappa, form) => {
    const norm = d => (d||"").slice(0,10);
    const sIdx = viaggio[tab].findIndex(d=>norm(d.date)===norm(form.startDate));
    const eIdx = viaggio[tab].findIndex(d=>norm(d.date)===norm(form.endDate));
    if(sIdx===-1||eIdx===-1||eIdx<sIdx){ alert("Controlla le date della tappa"); return; }

    // ── SHORT-CIRCUIT: se nessun campo che impatta i giorni è cambiato, ──
    // aggiorna solo i metadati della tappa senza toccare il daily data
    // (NON applicato alle tapppe di transito che potrebbero avere dati su giorno sbagliato)
    const isTransit = eIdx===sIdx;
    const DAILY_FIELDS = ['startDate','endDate','luogo','struttura','costoPiazzola',
      'costoPersona','numeroPersone','elettricita','moto','tassaSoggiorno',
      'costoDoccia','extraStruttura','kmTappa','costoCarburante','costoTraghetto','traghettoGiorno'];
    // Normalizza i valori default per evitare falsi positivi su campi non presenti in tapppe vecchie
    const normF = (k,v) => {
      if(v===undefined||v===null) { if(k==='traghettoGiorno') return 'partenza'; return ''; }
      return String(v);
    };
    const dailyChanged = DAILY_FIELDS.some(k => normF(k,form[k]) !== normF(k,oldTappa[k]));
    if(!dailyChanged && !isTransit){
      const copy = {...viaggio,
        tappe:(viaggio.tappe||[]).map(t=>t.id===oldTappa.id?{...oldTappa,...form,idTappa:oldTappa.idTappa}:t)};
      updateTrip(copy);
      setEditingTappa(null);
      return;
    }
    if(!dailyChanged && isTransit){
      // Short-circuit solo metadata + migrazione traghetto/km al giorno corretto
      const copy = {...viaggio,[tab]:[...viaggio[tab]],
        tappe:(viaggio.tappe||[]).map(t=>t.id===oldTappa.id?{...oldTappa,...form,idTappa:oldTappa.idTappa}:t)};
      // Migra vecchi dati da sIdx-1 → sIdx se necessario
      if(sIdx > 0){
        const prevD = copy[tab][sIdx-1];
        const curD  = copy[tab][sIdx];
        const oldKm  = n(oldTappa.kmTappa||0);
        const oldGas = n(oldTappa.costoCarburante||0);
        const oldTrag= n(oldTappa.costoTraghetto||0);
        // Se i vecchi valori sono su sIdx-1 (codice vecchio) e NON già su sIdx, sposta
        if(oldKm>0 && n(prevD.km)>=oldKm && n(curD.km)<oldKm){
          copy[tab][sIdx-1]={...prevD, km:Math.max(0,n(prevD.km)-oldKm)};
          copy[tab][sIdx]={...curD, km:n(curD.km)+oldKm};
        }
        if(oldGas>0 && n(prevD.gasolio)>=oldGas && n(curD.gasolio)<oldGas){
          copy[tab][sIdx-1]={...copy[tab][sIdx-1], gasolio:Math.max(0,n(copy[tab][sIdx-1].gasolio)-oldGas)};
          copy[tab][sIdx]={...copy[tab][sIdx], gasolio:n(copy[tab][sIdx].gasolio)+oldGas};
        }
        if(oldTrag>0 && n(prevD.traghetto)>=oldTrag && n(curD.traghetto)<oldTrag){
          copy[tab][sIdx-1]={...copy[tab][sIdx-1], traghetto:Math.max(0,n(copy[tab][sIdx-1].traghetto)-oldTrag)};
          copy[tab][sIdx]={...copy[tab][sIdx], traghetto:n(copy[tab][sIdx].traghetto)+oldTrag};
        }
      }
      updateTrip(copy);
      setEditingTappa(null);
      return;
    }

    // ── FULL RE-APPLY: dates o costi cambiati ────────────────────────────
    // Per transit: prima migra vecchi dati da sIdx-1 se necessario
    const fullCopy = [...viaggio[tab]];
    if(isTransit && sIdx > 0){
      // Migrazione: svuota vecchia posizione (sIdx-1) senza spostare su sIdx.
      // Il FULL RE-APPLY scriverà fresh su sIdx tramite il blocco fuel/traghetto sotto.
      const prevD = fullCopy[sIdx-1];
      const oldKm  = n(oldTappa.kmTappa||0);
      const oldGas = n(oldTappa.costoCarburante||0);
      const oldTrag= n(oldTappa.costoTraghetto||0);
      if(oldKm>0  && n(prevD.km)>=oldKm)
        fullCopy[sIdx-1]={...fullCopy[sIdx-1], km:Math.max(0,n(fullCopy[sIdx-1].km)-oldKm)};
      if(oldGas>0 && n(prevD.gasolio)>=oldGas)
        fullCopy[sIdx-1]={...fullCopy[sIdx-1], gasolio:Math.max(0,n(fullCopy[sIdx-1].gasolio)-oldGas)};
      if(oldTrag>0 && n(prevD.traghetto)>=oldTrag)
        fullCopy[sIdx-1]={...fullCopy[sIdx-1], traghetto:Math.max(0,n(fullCopy[sIdx-1].traghetto)-oldTrag)};
    }
    const copy = {...viaggio,[tab]:[...fullCopy].map(d=>{
      if(d.idTappa!==oldTappa.idTappa) return d;
      if(d.prevIdTappa){
        const prevT=(viaggio.tappe||[]).find(t=>t.idTappa===d.prevIdTappa);
        return {...d,idTappa:d.prevIdTappa,luogo:prevT?.luogo||"",struttura:prevT?.struttura||"",
          piazzola:0,tassa:0,doccia:0,extraStruttura:0,pagamentoCheckoutPrev:0,prevIdTappa:""};
      }
      return {...d,idTappa:"",luogo:"",struttura:"",piazzola:0,tassa:0,doccia:0,extraStruttura:0,pagamentoCheckoutPrev:0,prevIdTappa:""};
    }),tappe:(viaggio.tappe||[]).map(t=>t.id===oldTappa.id?{...t,...form,idTappa:oldTappa.idTappa}:t)};

    const piaz  = isTransit ? 0 : n(form.costoPiazzola)+n(form.costoPersona)*n(form.numeroPersone)+n(form.elettricita)+n(form.moto);
    const tassa  = isTransit ? 0 : n(form.tassaSoggiorno)*n(form.numeroPersone);
    const doccia = isTransit ? 0 : n(form.costoDoccia);

    const dayAtSIdx = copy[tab][sIdx];
    let pagamentoCheckoutPrev = 0, prevIdTappa = "";
    if(!isTransit && dayAtSIdx.idTappa && dayAtSIdx.idTappa !== oldTappa.idTappa){
      prevIdTappa = dayAtSIdx.idTappa;
      pagamentoCheckoutPrev = copy[tab].reduce((a,x)=>x.idTappa===prevIdTappa?a+n(x.piazzola)+n(x.tassa):a,0);
    }

    // Applica tappa ai giorni interni (sIdx→eIdx-1)
    for(let i=sIdx;i<eIdx;i++){
      copy[tab][i]={...copy[tab][i],idTappa:oldTappa.idTappa,luogo:form.luogo,struttura:form.struttura,
        piazzola:piaz,tassa,doccia,extraStruttura:n(form.extraStruttura),pagamentoCheckoutPrev:0,prevIdTappa:""};
    }

    if(isTransit){
      copy[tab][sIdx]={...copy[tab][sIdx],idTappa:oldTappa.idTappa,luogo:form.luogo,struttura:form.struttura,
        piazzola:0,tassa:0,doccia:0,extraStruttura:0,pagamentoCheckoutPrev:0,prevIdTappa:""};
    } else {
      const existingEidxDay = copy[tab][eIdx];
      const eIdxOwnedByOther = existingEidxDay.idTappa && existingEidxDay.idTappa !== oldTappa.idTappa;
      if(eIdxOwnedByOther){
        const newCheckout = copy[tab].reduce((a,x)=>x.idTappa===oldTappa.idTappa?a+n(x.piazzola)+n(x.tassa):a,0);
        copy[tab][eIdx]={...existingEidxDay, pagamentoCheckoutPrev:newCheckout, prevIdTappa:oldTappa.idTappa};
      } else {
        copy[tab][eIdx]={...existingEidxDay,idTappa:oldTappa.idTappa,luogo:form.luogo,struttura:form.struttura,
          piazzola:0,tassa:0,doccia:0,extraStruttura:0,pagamentoCheckoutPrev:0,prevIdTappa:""};
      }
    }
    if(pagamentoCheckoutPrev>0) copy[tab][sIdx]={...copy[tab][sIdx], pagamentoCheckoutPrev, prevIdTappa};

    const fuelIdx = isTransit ? sIdx : (sIdx > 0 ? sIdx - 1 : sIdx);
    if(n(form.kmTappa)>0){
      // FULL RE-APPLY: scrittura fresca (il giorno è stato resettato dal blocco clear sopra)
      copy[tab][fuelIdx]={...copy[tab][fuelIdx], km: n(form.kmTappa)};
    }
    if(n(form.costoCarburante)>0){
      copy[tab][fuelIdx]={...copy[tab][fuelIdx], gasolio: n(form.costoCarburante)};
    }
    if(n(form.costoTraghetto)>0){
      const tragIdx = isTransit ? sIdx : (form.traghettoGiorno==='arrivo' ? sIdx : fuelIdx);
      copy[tab][tragIdx]={...copy[tab][tragIdx], traghetto: n(form.costoTraghetto)};
    }
    updateTrip(copy);
    setEditingTappa(null);
  };

  const updateTappaBudget = (tappaId, val) => {
    const copy = {...viaggio, tappe:(viaggio.tappe||[]).map(t=>t.id===tappaId?{...t,budgetAllocato:val}:t)};
    updateTrip(copy);
  };

  const editTrip = form => {
    const newPreventivo = buildDays(form.startDate, form.endDate, viaggio.preventivo);
    const newConsuntivo = buildDays(form.startDate, form.endDate, viaggio.consuntivo);
    updateTrip({...viaggio,...form,budget:n(form.budget),
      veicolo:form.veicolo||"",
      consumoMedio:n(form.consumoMedio),
      prezzoCarburante:n(form.prezzoCarburante),
      status:form.status||viaggio.status||'ipotesi',
      gruppo:form.gruppo||'',
      sottogruppo:form.sottogruppo||'',
      preventivo:newPreventivo,consuntivo:newConsuntivo});
  };

  const tappe = (viaggio.tappe||[]).filter(t=>t.target===tab);

  return (
    <div>
      <div className="app-header" style={{height:"auto",flexDirection:"column",alignItems:"stretch",padding:"8px 12px",gap:6}}>
        {/* Row 1: back + title */}
        <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
          <button className="btn-icon" onClick={back} title="Torna alla lista" style={{flexShrink:0}}>←</button>
          <div style={{minWidth:0,flex:1,overflow:"hidden"}}>
            <div className="logo" style={{fontSize:14,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{viaggio.nome}</div>
            <div style={{fontSize:10,color:"var(--text2)"}}>
              {fmtDate(viaggio.startDate)} → {fmtDate(viaggio.endDate)} · {data.length}g
              &nbsp;·&nbsp;<span style={{color:"var(--primary)",fontWeight:600}}>€{fmt2(n(viaggio.budget))}</span>
            </div>
          </div>
        </div>
        {/* Row 2: tabs + actions */}
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"nowrap",overflowX:"auto",paddingBottom:2}}>
          <button className={`btn-tab ${tab==="preventivo"?"active":""}`} onClick={()=>setTab("preventivo")} style={{flexShrink:0,padding:"5px 10px",fontSize:12}}>Preventivo</button>
          <button className={`btn-tab ${tab==="consuntivo"?"active":""}`} onClick={()=>setTab("consuntivo")} style={{flexShrink:0,padding:"5px 10px",fontSize:12}}>Consuntivo</button>
          <div style={{marginLeft:"auto",display:"flex",gap:5,flexShrink:0}}>
            <button className="btn-icon no-print" onClick={()=>setTappa(true)} title="Aggiungi tappa" style={{padding:"5px 8px",fontSize:12}}>＋ Tappa</button>
            <button className="btn-icon no-print" onClick={()=>setShowFillDays(true)} title="Riempi giorni" style={{padding:"5px 8px",fontSize:12}}>⚡</button>
            <button className="btn-icon no-print" onClick={()=>exportCSV(viaggio,tab)} title="Esporta CSV" style={{padding:"5px 8px",fontSize:11}}>CSV</button>
            <button className="btn-icon no-print" onClick={()=>window.print()} title="Stampa" style={{padding:"5px 8px"}}>🖨</button>
            {onShare && <button className="btn-icon no-print" onClick={onShare} title="Condividi" style={{padding:"5px 8px"}}>👥</button>}
            <button className="btn-icon no-print" onClick={()=>setEdit(true)} title="Modifica" style={{padding:"5px 8px"}}>✏️</button>
          </div>
        </div>
      </div>

      <div className="container">
        {/* Tappe budget chain */}
        {tappe.length>0 && (
          <TappaChain
            tappe={tappe} data={data} tab={tab}
            budget={n(viaggio.budget)}
            onDelete={t=>setDelTappa(t)}
            onUpdateBudget={updateTappaBudget}
            onEdit={t=>setEditingTappa(t)}
          />
        )}

        {/* Stats toggle */}
        <div style={{display:"flex",gap:12,marginBottom:4}}>
          <button className="collapse-btn" onClick={()=>setStats(p=>!p)}>{showStats?"▾":"▸"} Statistiche</button>
          <button className="collapse-btn" onClick={()=>setChart(p=>!p)}>{showChart?"▾":"▸"} Grafico budget</button>
        </div>

        {showStats && <StatsPanel data={data} budget={viaggio.budget}/>}
        {showChart && <BudgetChart days={data} budget={viaggio.budget}/>}

        {/* Calcolatore carburante */}
        {n(viaggio.consumoMedio)>0 && (() => {
          const kmTot    = data.reduce((a,d)=>a+n(d.km),0);
          const litri    = kmTot * n(viaggio.consumoMedio) / 100;
          const costoEst = litri * n(viaggio.prezzoCarburante);
          const gasolio  = data.reduce((a,d)=>a+n(d.gasolio)+n(d.benzina),0);
          return (
            <div className="card-sm" style={{marginBottom:12,display:"flex",flexWrap:"wrap",gap:12,alignItems:"center"}}>
              <span style={{fontSize:12,color:"var(--text2)"}}>⛽ {viaggio.veicolo||"Veicolo"} · {n(viaggio.consumoMedio)} l/100km</span>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                <span style={{fontSize:12}}><span style={{color:"var(--text3)"}}>KM: </span><strong>{kmTot}</strong></span>
                <span style={{fontSize:12}}><span style={{color:"var(--text3)"}}>Litri stimati: </span><strong style={{color:"var(--accent)"}}>{litri.toFixed(1)}</strong></span>
                {n(viaggio.prezzoCarburante)>0 && <span style={{fontSize:12}}><span style={{color:"var(--text3)"}}>Costo stimato: </span><strong style={{color:"var(--accent)"}}>€{fmt2(costoEst)}</strong></span>}
                {gasolio>0 && <span style={{fontSize:12}}><span style={{color:"var(--text3)"}}>Inserito: </span><strong style={{color:"var(--primary)"}}>€{fmt2(gasolio)}</strong></span>}
              </div>
            </div>
          );
        })()}

        {/* View toggle + section header */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:16,marginBottom:8,flexWrap:"wrap"}}>
          <div className="section-title" style={{margin:0,flex:1,minWidth:120}}>
            {viewMode==="panoramica"?"Panoramica":viewMode==="delta"?"Preventivo vs Consuntivo":"Tabella dettaglio"}
            {viewMode!=="delta" && <span style={{color:"var(--text3)",fontWeight:400}}> — {tab}</span>}
          </div>
          <div className="view-toggle no-print">
            <button className={viewMode==="panoramica"?"active":""} onClick={()=>setViewMode("panoramica")}>📅 Panoramica</button>
            <button className={viewMode==="tabella"?"active":""} onClick={()=>setViewMode("tabella")}>📊 Tabella</button>
            <button className={viewMode==="delta"?"active":""} onClick={()=>setViewMode("delta")}>Δ Delta</button>
          </div>
          {viewMode==="tabella" && (
            <button className="btn btn-sm no-print" onClick={()=>setFsGrid(true)}
              style={{display:"flex",alignItems:"center",gap:5,color:"var(--primary)",borderColor:"var(--primary-dim)"}}>
              ⛶ Schermo intero
            </button>
          )}
        </div>

        {viewMode==="panoramica" && (
          <PanoramicaView data={data} budget={viaggio.budget} onOpenDetail={i=>setDayModal(i)}/>
        )}
        {viewMode==="tabella" && (
          <>
            <p style={{fontSize:11,color:"var(--text3)",margin:"0 0 6px"}}>* Pag. manuale: lascia vuoto per calcolo automatico al checkout della tappa.</p>
            <GridEditor data={data} budget={viaggio.budget} onChange={updateCell} onDayClick={i=>setDayModal(i)}/>
          </>
        )}
        {viewMode==="delta" && (
          <DeltaView viaggio={viaggio}/>
        )}
      </div>

      {showTappa && <TappaModal viaggio={viaggio} strutture={strutture} onAddStruttura={(nome,cb)=>{const ns={id:'st_'+Date.now(),nome,piazzola:0,costoPersona:0,elettricita:0,moto:0,soggiorno:0,doccia:0,note:''};if(onUpdateStrutture)onUpdateStrutture([...strutture,ns]);cb(ns);}} onClose={()=>setTappa(false)} onSave={addTappa}/>}
      {editingTappa && <TappaModal viaggio={viaggio} strutture={strutture} initial={editingTappa} onAddStruttura={(nome,cb)=>{const ns={id:'st_'+Date.now(),nome,piazzola:0,costoPersona:0,elettricita:0,moto:0,soggiorno:0,doccia:0,note:''};if(onUpdateStrutture)onUpdateStrutture([...strutture,ns]);cb(ns);}} onClose={()=>setEditingTappa(null)} onSave={form=>editTappaFn(editingTappa,form)}/>}
      {showFillDays && <FillDaysModal data={data} onApply={fillDays} onClose={()=>setShowFillDays(false)}/>}
      {showEdit  && <TripFormModal initial={viaggio} title="Modifica viaggio" veicoli={veicoli} sottogruppiMap={{}}
        onAddVeicolo={(nome,cb)=>{const nv={id:'veh_'+Date.now(),nome,icona:'🚐',consumoMedio:0,note:''};if(onUpdateVeicoli)onUpdateVeicoli([...veicoli,nv]);cb(nv);}}
        onClose={()=>setEdit(false)} onSave={editTrip} gruppiEsistenti={gruppiEsistenti}/>}
      {delTappa  && <Confirm msg={`Elimina la tappa "${delTappa.luogo}" e tutti i suoi dati struttura?`} onOk={()=>removeTappa(delTappa)} onClose={()=>setDelTappa(null)}/>}
      {fsGrid && <GridEditor data={data} budget={viaggio.budget} onChange={updateCell} fullscreen={true} onToggleFS={()=>setFsGrid(false)} onDayClick={i=>setDayModal(i)}/>}
      {dayModal!==null && <DayModal dayIndex={dayModal} data={data} budget={viaggio.budget} onClose={()=>setDayModal(null)} onChange={updateCell} consumoMedio={n(viaggio.consumoMedio)} prezzoCarburante={n(viaggio.prezzoCarburante)}/>}
    </div>
  );
}

// ── Firebase error → Italian ─────────────────────────────────────────────
const FB_ERR = {
  'auth/user-not-found':'Email non trovata',
  'auth/wrong-password':'Password errata',
  'auth/email-already-in-use':'Email già registrata',
  'auth/weak-password':'Password troppo corta (min. 6 caratteri)',
  'auth/invalid-email':'Email non valida',
  'auth/invalid-credential':'Email o password errati',
  'auth/too-many-requests':'Troppi tentativi, riprova tra qualche minuto',
  'auth/popup-closed-by-user':'Accesso Google annullato',
};
function fbErr(e){ const code=e?.code||''; return FB_ERR[code]||e?.message||'Errore sconosciuto'; }

// ── Login Screen ─────────────────────────────────────────────────────────
function LoginScreen(){
  const [mode,setMode]   = React.useState("login");
  const [email,setEmail] = React.useState("");
  const [pass,setPass]   = React.useState("");
  const [err,setErr]     = React.useState("");
  const [load,setLoad]   = React.useState(false);

  const handle = async () => {
    if(!email.trim()||!pass.trim()){ setErr("Compila email e password"); return; }
    setErr(""); setLoad(true);
    try {
      if(mode==="login"){
        await firebase.auth().signInWithEmailAndPassword(email.trim(), pass);
      } else {
        await firebase.auth().createUserWithEmailAndPassword(email.trim(), pass);
      }
    } catch(e){ setErr(fbErr(e)); }
    setLoad(false);
  };

  const googleLogin = async () => {
    setErr(""); setLoad(true);
    try {
      await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
    } catch(e){ setErr(fbErr(e)); }
    setLoad(false);
  };

  return (
    <div className="login-screen">
      <div className="login-card">
        <div className="login-logo">🚐</div>
        <h1 className="login-title">Viaggi Camper</h1>
        <p className="login-sub">v6.0 — sincronizzato nel cloud</p>

        <button className="btn-google" onClick={googleLogin} disabled={load}>
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Accedi con Google
        </button>

        <div className="login-divider"><span>oppure</span></div>

        <div className="field">
          <label className="field-label">Email</label>
          <input type="email" className="field-input" value={email}
            onChange={e=>setEmail(e.target.value)} placeholder="tua@email.com"
            onKeyDown={e=>e.key==="Enter"&&handle()}/>
        </div>
        <div className="field" style={{marginTop:10}}>
          <label className="field-label">Password</label>
          <input type="password" className="field-input" value={pass}
            onChange={e=>setPass(e.target.value)} placeholder="••••••••"
            onKeyDown={e=>e.key==="Enter"&&handle()}/>
        </div>

        {err && <div className="login-err">{err}</div>}

        <button className="btn-primary" style={{width:"100%",marginTop:14,padding:"12px"}}
          onClick={handle} disabled={load}>
          {load ? "⏳ Attendere..." : mode==="login" ? "Accedi" : "Registrati"}
        </button>

        <p className="login-switch">
          {mode==="login" ? "Non hai un account? " : "Hai già un account? "}
          <button onClick={()=>{setMode(m=>m==="login"?"register":"login");setErr("");}}>
            {mode==="login"?"Registrati":"Accedi"}
          </button>
        </p>
      </div>
    </div>
  );
}

// ── Share Modal ───────────────────────────────────────────────────────────
function ShareModal({viaggio, user, onClose}){
  const [email,setEmail] = React.useState("");
  const [status,setStatus] = React.useState(""); // ""|"loading"|"ok"|"err"
  const [msg,setMsg]     = React.useState("");
  const memberEmails     = viaggio.memberEmails || [user.email];
  const members          = viaggio.members || [user.uid];
  const isOwner          = viaggio.ownerId === user.uid;

  const addUser = async () => {
    const em = email.trim().toLowerCase();
    if(!em){ setErr("Inserisci un'email"); return; }
    if(memberEmails.includes(em)){ setStatus("err"); setMsg("Utente già presente"); return; }
    setStatus("loading"); setMsg("");
    try {
      const snap = await firebase.firestore().collection('users')
        .where('email','==',em).limit(1).get();
      if(snap.empty){ setStatus("err"); setMsg("Utente non trovato — deve prima registrarsi nell'app"); return; }
      const uid = snap.docs[0].id;
      await firebase.firestore().collection('viaggi').doc(viaggio.id).update({
        members:      firebase.firestore.FieldValue.arrayUnion(uid),
        memberEmails: firebase.firestore.FieldValue.arrayUnion(em),
      });
      setStatus("ok"); setMsg(`✓ ${em} aggiunto!`); setEmail("");
    } catch(e){ setStatus("err"); setMsg(fbErr(e)); }
  };

  const removeUser = async (uid, em) => {
    await firebase.firestore().collection('viaggi').doc(viaggio.id).update({
      members:      firebase.firestore.FieldValue.arrayRemove(uid),
      memberEmails: firebase.firestore.FieldValue.arrayRemove(em),
    });
  };

  return (
    <Modal title={`👥 Condividi — ${viaggio.nome}`} onClose={onClose} width="460px">
      <div className="section-title" style={{marginBottom:8}}>Partecipanti</div>
      {memberEmails.map((em,i)=>(
        <div key={em} className="share-member">
          <span style={{flex:1,fontSize:13,color:"var(--text)"}}>{em}</span>
          {em===user.email && <span className="badge">tu</span>}
          {i===0 && <span className="badge accent">owner</span>}
          {isOwner && em!==user.email && (
            <button className="btn-icon btn-sm" style={{color:"var(--red)"}}
              onClick={()=>removeUser(members[i],em)}>✕</button>
          )}
        </div>
      ))}

      <div className="section-title" style={{marginTop:20,marginBottom:8}}>Aggiungi persona</div>
      <p style={{fontSize:12,color:"var(--text2)",marginBottom:10}}>
        L'altra persona deve prima registrarsi nell'app con la stessa email.
      </p>
      <div style={{display:"flex",gap:8}}>
        <input type="email" className="field-input" value={email}
          onChange={e=>setEmail(e.target.value)} placeholder="email@esempio.com"
          onKeyDown={e=>e.key==="Enter"&&addUser()} style={{flex:1}}/>
        <button className="btn-primary" onClick={addUser} disabled={status==="loading"}>
          {status==="loading"?"...":"+ Aggiungi"}
        </button>
      </div>
      {msg && <p style={{fontSize:12,marginTop:8,
        color:status==="ok"?"var(--green)":"var(--red)"}}>{msg}</p>}
      <div className="btn-row"><button className="btn" onClick={onClose}>Chiudi</button></div>
    </Modal>
  );
}

// ── Viaggi Section ───────────────────────────────────────────────────────
// ── AssignSottogruppoModal ───────────────────────────────────────────────────
function AssignSottogruppoModal({viaggi, gruppiEsistenti, sottogruppiMap, updateTrip, onClose}){
  const [filterGruppo, setFilterGruppo] = React.useState(gruppiEsistenti[0]||'');
  const [sgInput,  setSgInput]  = React.useState('');
  const [useSgSel, setUseSgSel] = React.useState(false); // true = dropdown, false = testo
  const [sel, setSel] = React.useState(new Set());

  const sgEsistenti = sottogruppiMap[filterGruppo] || [];
  const candidati = filterGruppo
    ? viaggi.filter(v=>(v.gruppo||'').trim()===filterGruppo)
    : viaggi;
  const toggleV = id => setSel(s=>{ const ns=new Set(s); ns.has(id)?ns.delete(id):ns.add(id); return ns; });
  const toggleAll = () => setSel(s=>s.size===candidati.length?new Set():new Set(candidati.map(v=>v.id)));

  const apply = () => {
    const sg = sgInput.trim();
    if(!sg){ alert('Inserisci il nome del sotto-gruppo'); return; }
    if(!sel.size){ alert('Seleziona almeno un viaggio'); return; }
    candidati.filter(v=>sel.has(v.id)).forEach(v=>updateTrip({...v,sottogruppo:sg}));
    onClose();
  };

  return(
    <Modal title="📂 Assegna sotto-gruppo" onClose={onClose} width="480px">
      {/* Filtro gruppo */}
      {gruppiEsistenti.length>0&&(
        <div className="field" style={{marginBottom:12}}>
          <label className="field-label">📁 Filtra per gruppo</label>
          <select className="field-input" value={filterGruppo}
            onChange={e=>{setFilterGruppo(e.target.value);setSel(new Set());}}>
            <option value="">— Tutti i viaggi —</option>
            {gruppiEsistenti.map(g=><option key={g} value={g}>{g}</option>)}
          </select>
        </div>
      )}

      {/* Sotto-gruppo da assegnare */}
      <div className="field" style={{marginBottom:12}}>
        <label className="field-label">📂 Sotto-gruppo da assegnare</label>
        {sgEsistenti.length>0&&useSgSel ? (
          <div style={{display:'flex',gap:8}}>
            <select className="field-input" style={{flex:1}} value={sgInput}
              onChange={e=>{ if(e.target.value==='__nuovo__'){setUseSgSel(false);setSgInput('');}else setSgInput(e.target.value);}}>
              <option value="">— Seleziona —</option>
              {sgEsistenti.map(sg=><option key={sg} value={sg}>{sg}</option>)}
              <option value="__nuovo__">➕ Nuovo...</option>
            </select>
          </div>
        ) : (
          <div style={{display:'flex',gap:8}}>
            <input type="text" className="field-input" style={{flex:1}} autoFocus
              value={sgInput} onChange={e=>setSgInput(e.target.value)}
              placeholder="es. Settimana 1, Tappa Nord..."/>
            {sgEsistenti.length>0&&<button className="btn" style={{flexShrink:0,fontSize:12,padding:'7px 10px'}}
              onClick={()=>{setUseSgSel(true);setSgInput('');}}>← Esistenti</button>}
          </div>
        )}
        {/* Chips sottogruppi esistenti come scorciatoia */}
        {sgEsistenti.length>0&&!useSgSel&&(
          <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:8}}>
            {sgEsistenti.map(sg=>(
              <button key={sg} onClick={()=>setSgInput(sg)}
                style={{padding:'3px 10px',borderRadius:14,fontSize:11,cursor:'pointer',
                  border:'1px solid '+(sgInput===sg?'var(--primary)':'var(--border)'),
                  background:sgInput===sg?'var(--primary-faint)':'transparent',
                  color:sgInput===sg?'var(--primary)':'var(--text2)'}}>
                {sg}
              </button>
            ))}
          </div>
        )}
      </div>

      {/* Lista viaggi */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div style={{fontSize:12,color:'var(--text2)'}}>
          {candidati.length} viaggi · <strong>{sel.size}</strong> selezionati
        </div>
        <button className="btn" style={{fontSize:11,padding:'4px 10px'}} onClick={toggleAll}>
          {sel.size===candidati.length?'Deseleziona tutti':'Seleziona tutti'}
        </button>
      </div>
      <div style={{maxHeight:280,overflowY:'auto',border:'1px solid var(--border)',borderRadius:10,marginBottom:14}}>
        {candidati.length===0&&<div style={{padding:'16px',fontSize:12,color:'var(--text3)',textAlign:'center'}}>Nessun viaggio in questo gruppo</div>}
        {candidati.sort((a,b)=>a.startDate>b.startDate?1:-1).map((v,i)=>{
          const isSel=sel.has(v.id);
          const isConf=(v.status||'ipotesi')==='confermato';
          return(
            <div key={v.id} onClick={()=>toggleV(v.id)}
              style={{display:'flex',alignItems:'center',gap:10,padding:'9px 14px',cursor:'pointer',
                borderBottom:i<candidati.length-1?'1px solid var(--border)':'none',
                background:isSel?'rgba(79,216,180,.07)':'transparent'}}>
              <div style={{width:20,height:20,borderRadius:4,flexShrink:0,
                border:'2px solid '+(isSel?'var(--primary)':'var(--border)'),
                background:isSel?'var(--primary)':'transparent',
                display:'flex',alignItems:'center',justifyContent:'center',
                color:'var(--bg)',fontSize:12,fontWeight:700}}>
                {isSel?'✓':''}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600,display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                  <span>{v.nome}</span>
                  <span style={{fontSize:10,padding:'1px 6px',borderRadius:8,
                    background:isConf?'rgba(82,214,138,.15)':'rgba(79,216,180,.1)',
                    color:isConf?'var(--green)':'var(--primary)'}}>
                    {isConf?'✅':'💭'}
                  </span>
                </div>
                <div style={{fontSize:10,color:'var(--text3)'}}>
                  {fmtDate(v.startDate)} → {fmtDate(v.endDate)}
                  {v.sottogruppo&&<span style={{color:'var(--accent)',marginLeft:6}}>📂 {v.sottogruppo}</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="btn-row">
        <button className="btn-primary" onClick={apply}>
          ✓ Assegna "{sgInput||'...'}" a {sel.size} {sel.size===1?'viaggio':'viaggi'}
        </button>
        <button className="btn" onClick={onClose}>Annulla</button>
      </div>
    </Modal>
  );
}

// ── GruppiManager ────────────────────────────────────────────────────────
function GruppiManager({gruppi, viaggi, updateTrip, onClose}){
  const [editId, setEditId]   = React.useState(null);  // nome gruppo in editing
  const [newName, setNewName] = React.useState('');
  const [confirm, setConfirm] = React.useState(null);  // gruppo da eliminare

  const renameGruppo = (oldName, name) => {
    const trimmed = name.trim();
    if(!trimmed){ alert('Inserisci un nome'); return; }
    if(trimmed===oldName){ setEditId(null); return; }
    viaggi.filter(v=>(v.gruppo||'').trim()===oldName).forEach(v=>updateTrip({...v,gruppo:trimmed}));
    setEditId(null);
  };
  const deleteGruppo = (name) => {
    viaggi.filter(v=>(v.gruppo||'').trim()===name).forEach(v=>updateTrip({...v,gruppo:''}));
    setConfirm(null);
  };

  return(
    <Modal title="📁 Gestisci Gruppi" onClose={onClose} width="420px">
      {gruppi.length===0&&(
        <div style={{textAlign:'center',color:'var(--text3)',fontSize:13,padding:'20px 0'}}>
          Nessun gruppo creato.<br/>Aggiungilo dal form del viaggio.
        </div>
      )}
      {gruppi.map(g=>{
        const count = viaggi.filter(v=>(v.gruppo||'').trim()===g).length;
        const isEdit = editId===g;
        return(
          <div key={g} style={{marginBottom:10,borderRadius:10,border:'1px solid var(--border)',overflow:'hidden'}}>
            {isEdit
              ? <div style={{display:'flex',gap:8,padding:'10px 12px',alignItems:'center'}}>
                  <input autoFocus className="field-input" style={{flex:1,fontSize:13,padding:'6px 10px'}}
                    value={newName} onChange={e=>setNewName(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter')renameGruppo(g,newName);if(e.key==='Escape')setEditId(null);}}
                    placeholder="Nuovo nome"/>
                  <button className="btn-primary" style={{padding:'6px 12px',fontSize:12}} onClick={()=>renameGruppo(g,newName)}>✓</button>
                  <button className="btn" style={{padding:'6px 10px',fontSize:12}} onClick={()=>setEditId(null)}>✕</button>
                </div>
              : <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px'}}>
                  <span style={{fontSize:18}}>📁</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600}}>{g}</div>
                    <div style={{fontSize:11,color:'var(--text3)'}}>{count} {count===1?'viaggio':'viaggi'}</div>
                  </div>
                  <button className="btn-icon btn-sm" title="Rinomina"
                    onClick={()=>{setEditId(g);setNewName(g);}}>✏️</button>
                  <button className="btn-icon btn-sm" style={{color:'var(--red)'}} title="Elimina gruppo"
                    onClick={()=>setConfirm(g)}>🗑️</button>
                </div>
            }
          </div>
        );
      })}
      {confirm&&(
        <div style={{background:'rgba(240,96,96,.1)',border:'1px solid rgba(240,96,96,.3)',borderRadius:10,padding:'12px 14px',marginTop:10}}>
          <div style={{fontSize:13,marginBottom:10}}>Eliminare il gruppo <strong>"{confirm}"</strong>?<br/>
            <span style={{fontSize:11,color:'var(--text3)'}}>I {viaggi.filter(v=>(v.gruppo||'').trim()===confirm).length} viaggi perderanno il gruppo ma non verranno eliminati.</span>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn" style={{flex:1,color:'var(--red)',fontSize:12}} onClick={()=>deleteGruppo(confirm)}>Elimina</button>
            <button className="btn" style={{flex:1,fontSize:12}} onClick={()=>setConfirm(null)}>Annulla</button>
          </div>
        </div>
      )}
      <div className="btn-row" style={{marginTop:14}}>
        <button className="btn" onClick={onClose}>Chiudi</button>
      </div>
    </Modal>
  );
}

function ViaggiaSection({viaggi, onBack, onOpen, signOut, user, showNew, setNew, delId, setDel, showShare, setShare, addTrip, removeTrip, updateTrip, strutture=[], onUpdateStrutture, veicoli=[], onUpdateVeicoli}){
  useBack(onBack);
  const [statusFil, setStatusFil] = React.useState('all');
  const [expandedY,  setExpandedY]  = React.useState({});
  const [expandedG,  setExpandedG]  = React.useState({});
  const [expandedSG, setExpandedSG] = React.useState({});
  const [copyData,   setCopyData]   = React.useState(null);
  const [showGruppi, setShowGruppi] = React.useState(false);
  const [vsView,     setVsView]     = React.useState('viaggi');
  const [strSub,     setStrSub]     = React.useState('strutture'); // 'strutture'|'veicoli'
  const [strModal,   setStrModal]   = React.useState(null);
  const [veicoloModal, setVeicoloModal] = React.useState(null);
  const [showAssignSG, setShowAssignSG] = React.useState(false);

  const toggleStatus = (v) => {
    const newStatus = (v.status||'ipotesi')==='ipotesi' ? 'confermato' : 'ipotesi';
    updateTrip({...v, status:newStatus});
  };

  const filtered = viaggi.filter(v =>
    statusFil==='all' || (v.status||'ipotesi')===statusFil
  );

  // Raggruppa per anno → gruppo
  const byYear = {};
  filtered.forEach(v => {
    const year = (v.startDate||'').slice(0,4)||'?';
    const grp  = (v.gruppo||'').trim()||'—';
    if(!byYear[year])      byYear[year]={};
    if(!byYear[year][grp]) byYear[year][grp]=[];
    byYear[year][grp].push(v);
  });
  const years = Object.keys(byYear).sort((a,b)=>b-a);
  const isExpY = y   => expandedY[y]!==false;
  const isExpG = key => expandedG[key]===true;
  const isExpSG= key => expandedSG[key]!==false; // sottogruppo: default espanso
  const togY   = y   => setExpandedY(p=>({...p,[y]:!isExpY(y)}));
  const togG   = key => setExpandedG(p=>({...p,[key]:!isExpG(key)}));
  const togSG  = key => setExpandedSG(p=>({...p,[key]:!isExpSG(key)}));

  const totIpotesi  = viaggi.filter(v=>(v.status||'ipotesi')==='ipotesi').length;
  const totConf     = viaggi.filter(v=>(v.status||'ipotesi')==='confermato').length;
  const gruppiEsistenti = [...new Set(viaggi.map(v=>(v.gruppo||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'it'));
  // Mappa gruppo → [sottogruppi]
  const sottogruppiMap = viaggi.reduce((acc,v)=>{
    const g=(v.gruppo||'').trim(); const sg=(v.sottogruppo||'').trim();
    if(g&&sg){ if(!acc[g])acc[g]=[]; if(!acc[g].includes(sg))acc[g].push(sg); }
    return acc;
  },{});

  return(
    <div>
      {/* Header — semplificato, non va fuori schermo */}
      <div className="app-header">
        <div style={{display:'flex',alignItems:'center',gap:6,width:'100%'}}>
          <button className="btn-icon" onClick={onBack} style={{flexShrink:0}}>←</button>
          <div className="logo" style={{fontSize:14,flex:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
            {vsView==='strutture'?'🏕️ Strutture':'✈️ Viaggi'}
          </div>
          {vsView==='viaggi'&&<button className="btn" style={{padding:'5px 8px',fontSize:11,flexShrink:0}} onClick={()=>setShowGruppi(true)}>📁</button>}
          {vsView==='viaggi'&&<button className="btn" style={{padding:'5px 8px',fontSize:11,flexShrink:0}} title="Assegna sotto-gruppo" onClick={()=>setShowAssignSG(true)}>📂</button>}
          {vsView==='viaggi'&&<button className="btn-primary" style={{padding:'6px 10px',fontSize:12,flexShrink:0}} onClick={()=>setNew(true)}>＋ Nuovo</button>}
          {vsView==='strutture'&&strSub==='strutture'&&<button className="btn-primary" style={{padding:'6px 10px',fontSize:12,flexShrink:0}} onClick={()=>setStrModal({data:{id:null,nome:'',note:'',tariffe:[]}})}>＋ Struttura</button>}
          {vsView==='strutture'&&strSub==='veicoli'&&<button className="btn-primary" style={{padding:'6px 10px',fontSize:12,flexShrink:0}} onClick={()=>setVeicoloModal({id:null,nome:'',icona:'🚐',consumoMedio:0,note:''})}>＋ Veicolo</button>}
          <button className="btn-icon" onClick={signOut} title="Esci" style={{fontSize:16,flexShrink:0}}>🚪</button>
        </div>
      </div>

      {/* Barra filtri + bottone Strutture */}
      <div style={{display:'flex',alignItems:'center',gap:5,padding:'8px 12px',borderBottom:'1px solid var(--border)',background:'var(--card)',flexWrap:'wrap'}}>
        {vsView==='viaggi'&&[['all',`Tutti (${viaggi.length})`],['ipotesi',`💭 ${totIpotesi}`],['confermato',`✅ ${totConf}`]].map(([f,l])=>(
          <button key={f} className={`btn-tab${statusFil===f?' active':''}`}
            style={{padding:'5px 8px',fontSize:11,flexShrink:0}} onClick={()=>setStatusFil(f)}>{l}</button>
        ))}
        {vsView==='strutture'&&<span style={{fontSize:11,color:'var(--text2)',flex:1}}>{strutture.length} strutture censite</span>}
        <div style={{flex:1}}/>
        {/* Tab Strutture — sempre visibile */}
        <button onClick={()=>setVsView(v=>v==='viaggi'?'strutture':'viaggi')}
          style={{padding:'5px 10px',fontSize:11,fontWeight:700,borderRadius:20,cursor:'pointer',flexShrink:0,
            border:'1.5px solid '+(vsView==='strutture'?'var(--primary)':'var(--border)'),
            background:vsView==='strutture'?'var(--primary)':'transparent',
            color:vsView==='strutture'?'var(--bg)':'var(--text2)'}}>
          🏕️ Strutture
        </button>
      </div>

      {/* ── VISTA STRUTTURE ── */}
      {vsView==='strutture'&&(
        <div className="container">
          {/* Sub-toggle */}
          <div style={{display:'flex',gap:0,borderRadius:10,overflow:'hidden',border:'1px solid var(--border)',marginBottom:14}}>
            {[['strutture','🏕️ Strutture'],['veicoli','🚐 Veicoli']].map(([k,lbl])=>(
              <button key={k} onClick={()=>setStrSub(k)}
                style={{flex:1,padding:'8px 4px',fontSize:12,fontWeight:600,border:'none',cursor:'pointer',
                  background:strSub===k?'var(--primary)':'var(--card)',
                  color:strSub===k?'var(--bg)':'var(--text2)',transition:'background .15s'}}>
                {lbl}
              </button>
            ))}
          </div>

          {/* Lista strutture */}
          {strSub==='strutture'&&(<>
            {strutture.length===0&&<div className="empty" style={{paddingTop:30}}><div className="empty-icon">🏕️</div><p>Nessuna struttura censita.<br/>Tocca "＋ Struttura".</p></div>}
            {strutture.map(s=>{
              const sm=migrateTariffe(s);
              return(
                <div key={s.id} className="card-sm" style={{marginBottom:10,padding:'12px 14px'}}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>{s.nome}</div>
                      {sm.tariffe.length===0&&<div style={{fontSize:11,color:'var(--text3)'}}>Nessuna tariffa</div>}
                      {sm.tariffe.map(t=>(
                        <div key={t.id} style={{fontSize:10,color:'var(--text3)',marginBottom:2}}>
                          <span style={{color:'var(--primary)',fontWeight:600}}>{tariffLabel(t)}</span>
                          {t.piazzola>0&&<span> · 🏕️€{t.piazzola}</span>}
                          {t.costoPersona>0&&<span> · 👤€{t.costoPersona}</span>}
                          {t.elettricita>0&&<span> · ⚡€{t.elettricita}</span>}
                          {t.moto>0&&<span> · 🛵€{t.moto}</span>}
                          {t.soggiorno>0&&<span> · 🏛️€{t.soggiorno}/p</span>}
                          {t.doccia>0&&<span style={{color:'var(--primary)'}}> · 🚿€{t.doccia}</span>}
                        </div>
                      ))}
                      {s.note&&<div style={{fontSize:11,color:'var(--text2)',marginTop:4}}>{s.note}</div>}
                    </div>
                    <button className="btn-icon btn-sm" onClick={()=>setStrModal({data:migrateTariffe({...s}),editingTar:null})}>✏️</button>
                  </div>
                </div>
              );
            })}
          </>)}

          {/* Lista veicoli */}
          {strSub==='veicoli'&&(<>
            {veicoli.length===0&&<div className="empty" style={{paddingTop:30}}><div className="empty-icon">🚐</div><p>Nessun veicolo censito.<br/>Tocca "＋ Veicolo".</p></div>}
            {veicoli.map(v=>(
              <div key={v.id} className="card-sm" style={{marginBottom:10,padding:'12px 14px',display:'flex',alignItems:'center',gap:12}}>
                <span style={{fontSize:24}}>{v.icona||'🚐'}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:700}}>{v.nome}</div>
                  <div style={{fontSize:11,color:'var(--text3)'}}>⛽ {v.consumoMedio} l/100km{v.note?` · ${v.note}`:''}</div>
                </div>
                <button className="btn-icon btn-sm" onClick={()=>setVeicoloModal({...v})}>✏️</button>
              </div>
            ))}
          </>)}
        </div>
      )}

      {/* ── VISTA VIAGGI ── */}
      {vsView==='viaggi'&&(
        <div>

        <div className="container">
          {filtered.length===0&&(
            <div className="empty" style={{paddingTop:50}}>
              <div className="empty-icon">🚐</div>
              <p style={{color:'var(--text2)'}}>Nessun viaggio trovato</p>
              <button className="btn-primary" style={{marginTop:16}} onClick={()=>setNew(true)}>＋ Nuovo viaggio</button>
            </div>
          )}

          {years.map(year=>{
            const expY = isExpY(year);
            const totInYear = Object.values(byYear[year]).flat().length;
            const confInYear = Object.values(byYear[year]).flat().filter(v=>(v.status||'ipotesi')==='confermato').length;
            return(
              <div key={year} style={{marginBottom:20}}>
                <div onClick={()=>togY(year)} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',cursor:'pointer',borderBottom:'2px solid var(--primary-dim)',marginBottom:expY?12:0}}>
                  <span style={{fontSize:22,fontFamily:"'Syne',sans-serif",fontWeight:800,color:'var(--primary)'}}>{year}</span>
                  <span style={{fontSize:11,color:'var(--text3)',flex:1}}>
                    {totInYear} {totInYear===1?'viaggio':'viaggi'} · {confInYear} confermati
                  </span>
                  <span style={{color:'var(--text3)',fontSize:13}}>{expY?'▲':'▼'}</span>
                </div>

                {expY && Object.entries(byYear[year]).sort(([a],[b])=>a.localeCompare(b,'it')).map(([grp,trips])=>{
                  const gkey = year+'_'+grp;
                  const expG = isExpG(gkey);
                  const confInGrp = trips.filter(v=>(v.status||'ipotesi')==='confermato').length;
                  const ipotInGrp = trips.filter(v=>(v.status||'ipotesi')==='ipotesi').length;
                  // Controlla se ci sono sottogruppi
                  const hasSG = trips.some(v=>(v.sottogruppo||'').trim());
                  const bySG = {};
                  if(hasSG){
                    trips.forEach(v=>{
                      const sg=(v.sottogruppo||'').trim()||'__none__';
                      if(!bySG[sg])bySG[sg]=[];
                      bySG[sg].push(v);
                    });
                  }
                  const renderTripRow = (v,idx,arr) => {
                    const isConf=(v.status||'ipotesi')==='confermato';
                    const giorni=diffInclusive(v.startDate,v.endDate);
                    const stats=getStats(v.consuntivo||[],v.budget);
                    const hasData=(v.consuntivo||[]).some(d=>calcCosto(d)>0);
                    return(
                      <div key={v.id} style={{padding:'10px 14px',cursor:'pointer',
                        borderBottom:idx<arr.length-1?'1px solid var(--border)':'none',
                        background:'var(--bg2)'}} onClick={()=>onOpen(v.id)}>
                        <div style={{display:'flex',alignItems:'center',gap:8}}>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:3,flexWrap:'wrap'}}>
                              <span style={{fontSize:13,fontWeight:600,color:'var(--text)'}}>{v.nome}</span>
                              <span onClick={e=>{e.stopPropagation();toggleStatus(v);}}
                                title="Tocca per cambiare stato"
                                style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:10,cursor:'pointer',
                                  background:isConf?'rgba(82,214,138,.15)':'rgba(79,216,180,.08)',
                                  color:isConf?'var(--green)':'var(--primary)',
                                  border:'1px solid '+(isConf?'var(--green)':'var(--primary)')}}>
                                {isConf?'✅ Confermato':'💭 Ipotesi'}
                              </span>
                            </div>
                            <div style={{fontSize:11,color:'var(--text3)'}}>
                              {fmtDate(v.startDate)} → {fmtDate(v.endDate)} · {giorni}g · €{fmt2(n(v.budget))}
                              {hasData&&<span style={{color:stats.residuo>=0?'var(--green)':'var(--red)',marginLeft:6}}>
                                res. €{fmt2(stats.residuo)}
                              </span>}
                            </div>
                          </div>
                          <div style={{display:'flex',gap:3,flexShrink:0}} onClick={e=>e.stopPropagation()}>
                            <button className="btn-icon btn-sm" title="Copia" onClick={()=>setCopyData(v)} style={{fontSize:13,padding:'4px 5px'}}>📋</button>
                            <button className="btn-icon btn-sm" style={{color:'var(--primary)',padding:'4px 5px'}} onClick={()=>setShare(v)} title="Condividi">👥</button>
                            {v.ownerId===user.uid
                              ? <button className="btn-icon btn-sm" style={{color:'var(--red)',padding:'4px 5px'}} onClick={()=>setDel(v.id)}>🗑</button>
                              : <span title="Viaggio condiviso — solo il proprietario può eliminarlo" style={{fontSize:13,opacity:.4,padding:'4px 5px',cursor:'default'}}>🔒</span>}
                          </div>
                        </div>
                      </div>
                    );
                  };

                  return(
                    <div key={grp} style={{marginBottom:10,background:'var(--card)',borderRadius:14,border:'1px solid var(--border2)',overflow:'hidden'}}>
                      <div onClick={()=>togG(gkey)}
                        style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px',cursor:'pointer',
                          background:expG?'var(--card2)':'var(--card)'}}>
                        <span style={{fontSize:18,flexShrink:0}}>📁</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:14,fontWeight:700,color:'var(--text)'}}>{grp}</div>
                          <div style={{fontSize:11,color:'var(--text3)',marginTop:2,display:'flex',gap:8}}>
                            <span>{trips.length} {trips.length===1?'viaggio':'viaggi'}</span>
                            {confInGrp>0&&<span style={{color:'var(--green)'}}>✅ {confInGrp}</span>}
                            {ipotInGrp>0&&<span style={{color:'var(--primary)'}}>💭 {ipotInGrp}</span>}
                          </div>
                        </div>
                        <span style={{color:'var(--text3)',fontSize:13,flexShrink:0}}>{expG?'▲':'▼'}</span>
                      </div>

                      {expG&&(
                        <div style={{borderTop:'1px solid var(--border)'}}>
                          {!hasSG && trips.sort((a,b)=>a.startDate>b.startDate?1:-1).map((v,idx,arr)=>renderTripRow(v,idx,arr))}
                          {hasSG && Object.entries(bySG).sort(([a],[b])=>{if(a==='__none__')return 1;if(b==='__none__')return -1;return a.localeCompare(b,'it');}).map(([sg,sgTrips])=>{
                            const sgKey=gkey+'_'+sg;
                            const isNone=sg==='__none__';
                            const expSG=isExpSG(sgKey);
                            return(
                              <div key={sg} style={{borderBottom:'1px solid var(--border)'}}>
                                {!isNone&&(
                                  <div onClick={()=>togSG(sgKey)}
                                    style={{display:'flex',alignItems:'center',gap:8,padding:'9px 16px',cursor:'pointer',
                                      background:expSG?'rgba(79,216,180,.05)':'transparent'}}>
                                    <span style={{fontSize:14}}>📂</span>
                                    <div style={{flex:1,fontSize:13,fontWeight:600,color:'var(--text2)'}}>{sg}</div>
                                    <span style={{fontSize:11,color:'var(--text3)'}}>{sgTrips.length} viaggi</span>
                                    <span style={{color:'var(--text3)',fontSize:11}}>{expSG?'▲':'▼'}</span>
                                  </div>
                                )}
                                {(isNone||expSG)&&sgTrips.sort((a,b)=>a.startDate>b.startDate?1:-1).map((v,idx,arr)=>renderTripRow(v,idx,arr))}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>)}

      {showNew&&<TripFormModal title="Nuovo viaggio" gruppiEsistenti={gruppiEsistenti} sottogruppiMap={sottogruppiMap} veicoli={veicoli}
        onAddVeicolo={(nome,cb)=>{const nv={id:'veh_'+Date.now(),nome,icona:'🚐',consumoMedio:0,note:''};if(onUpdateVeicoli)onUpdateVeicoli([...veicoli,nv]);cb(nv);}}
        onClose={()=>setNew(false)} onSave={f=>{addTrip(f);setNew(false);}}/>}
      {copyData&&<TripFormModal title="📋 Copia viaggio" isCopy gruppiEsistenti={gruppiEsistenti} sottogruppiMap={sottogruppiMap} veicoli={veicoli}
        onAddVeicolo={(nome,cb)=>{const nv={id:'veh_'+Date.now(),nome,icona:'🚐',consumoMedio:0,note:''};if(onUpdateVeicoli)onUpdateVeicoli([...veicoli,nv]);cb(nv);}}
        initial={{...copyData, nome:copyData.nome+' (copia)', preventivo:undefined, consuntivo:undefined, tappe:[]}}
        onClose={()=>setCopyData(null)} onSave={f=>{addTrip(f);setCopyData(null);}}/>}
      {delId&&<Confirm msg={`Eliminare "${(viaggi.find(v=>v.id===delId)||{}).nome}"? Tutti i dati andranno persi.`}
        onOk={()=>{removeTrip(delId);setDel(null);}} onClose={()=>setDel(null)}/>}
      {showShare&&<ShareModal viaggio={showShare} user={user} onClose={()=>setShare(null)}/>}
      {showGruppi&&<GruppiManager gruppi={gruppiEsistenti} viaggi={viaggi} updateTrip={updateTrip} onClose={()=>setShowGruppi(false)}/>}
      {showAssignSG&&<AssignSottogruppoModal viaggi={viaggi} gruppiEsistenti={gruppiEsistenti} sottogruppiMap={sottogruppiMap} updateTrip={updateTrip} onClose={()=>setShowAssignSG(false)}/>}

      {/* Modal Veicolo */}
      {veicoloModal&&(
        <Modal title={veicoloModal.id?'Modifica Veicolo':'Nuovo Veicolo'} onClose={()=>setVeicoloModal(null)} width="400px">
          <div className="form-grid" style={{gap:10}}>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Nome / Targa *</label>
              <input className="field-input" value={veicoloModal.nome||''} placeholder="es. Mobilvetta BP056YC"
                onChange={e=>setVeicoloModal(m=>({...m,nome:e.target.value}))}/>
            </div>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Icona</label>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {VEICOLO_TIPI.map(([ic,lbl])=>(
                  <div key={ic} onClick={()=>setVeicoloModal(m=>({...m,icona:ic}))}
                    style={{padding:'6px 10px',borderRadius:8,cursor:'pointer',fontSize:18,
                      border:'2px solid '+(veicoloModal.icona===ic?'var(--primary)':'var(--border)'),
                      background:veicoloModal.icona===ic?'var(--primary-faint)':'var(--card)'}}
                    title={lbl}>{ic}</div>
                ))}
              </div>
            </div>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">⛽ Consumo medio predefinito (l/100km)</label>
              <input type="number" className="field-input" value={veicoloModal.consumoMedio||''} placeholder="es. 12"
                onFocus={e=>e.target.select()}
                onChange={e=>setVeicoloModal(m=>({...m,consumoMedio:+e.target.value||0}))}/>
            </div>
            <div className="field" style={{gridColumn:'1/-1'}}>
              <label className="field-label">Note</label>
              <input className="field-input" value={veicoloModal.note||''} placeholder="Note opzionali"
                onChange={e=>setVeicoloModal(m=>({...m,note:e.target.value}))}/>
            </div>
          </div>
          <div className="btn-row">
            <button className="btn-primary" onClick={()=>{
              if(!veicoloModal.nome?.trim()){alert('Inserisci il nome');return;}
              const v=veicoloModal;
              const newList=v.id&&veicoli.find(x=>x.id===v.id)

            </div>
          </Modal>
        );
      })()}
    </div>
  );
}

// ── Dispensa Share Modal ─────────────────────────────────────────────────
function DispensaShareModal({dispensa, dispensaId, user, onClose}){
  const [email,setEmail]=React.useState('');
  const [status,setStatus]=React.useState('');
  const [msg,setMsg]=React.useState('');
  const memberEmails=dispensa.memberEmails||[user.email];
  const members=dispensa.members||[user.uid];
  const isOwner=dispensa.ownerId===user.uid;
  const addUser=async()=>{
    const em=email.trim().toLowerCase();
    if(!em){setStatus('err');setMsg('Inserisci un email');return;}
    if(memberEmails.includes(em)){setStatus('err');setMsg('Utente già presente');return;}
    setStatus('loading');setMsg('');
    try{
      const snap=await firebase.firestore().collection('users').where('email','==',em).limit(1).get();
      if(snap.empty){setStatus('err');setMsg("Utente non trovato — deve prima registrarsi nell'app");return;}
      const uid=snap.docs[0].id;
      await firebase.firestore().collection('dispensa').doc(dispensaId).update({
        members:firebase.firestore.FieldValue.arrayUnion(uid),
        memberEmails:firebase.firestore.FieldValue.arrayUnion(em),
      });
      setStatus('ok');setMsg('✓ '+em+' aggiunto!');setEmail('');
    }catch(e){setStatus('err');setMsg(e.message);}
  };
  const removeUser=async(uid,em)=>{
    await firebase.firestore().collection('dispensa').doc(dispensaId).update({
      members:firebase.firestore.FieldValue.arrayRemove(uid),
      memberEmails:firebase.firestore.FieldValue.arrayRemove(em),
    });
  };
  return(
    <Modal title="👥 Condividi Dispensa" onClose={onClose} width="460px">
      <div className="section-title" style={{marginBottom:8}}>Partecipanti</div>
      {memberEmails.map((em,i)=>(
        <div key={em} className="share-member">
          <span style={{flex:1,fontSize:13}}>{em}</span>
          {em===user.email&&<span className="badge">tu</span>}
          {i===0&&<span className="badge accent">owner</span>}
          {isOwner&&em!==user.email&&(
            <button className="btn-icon btn-sm" style={{color:'var(--red)'}} onClick={()=>removeUser(members[i],em)}>✕</button>
          )}
        </div>
      ))}
      <div className="section-title" style={{marginTop:16,marginBottom:8}}>Aggiungi persona</div>
      <p style={{fontSize:12,color:'var(--text2)',marginBottom:10}}>L'altra persona deve prima registrarsi nell'app con la stessa email.</p>
      <div style={{display:'flex',gap:8}}>
        <input type="email" className="field-input" value={email} onChange={e=>setEmail(e.target.value)}
          placeholder="email@esempio.com" onKeyDown={e=>e.key==='Enter'&&addUser()} style={{flex:1}}/>
        <button className="btn-primary" onClick={addUser} disabled={status==='loading'}>{status==='loading'?'...':'+ Aggiungi'}</button>
      </div>
      {msg&&<p style={{fontSize:12,marginTop:8,color:status==='ok'?'var(--green)':'var(--red)'}}>{msg}</p>}
      <div className="btn-row"><button className="btn" onClick={onClose}>Chiudi</button></div>
    </Modal>
  );
}
